name: E2E (Maestro)

# Runs Maestro flows on an Android emulator in GitHub Actions, so they don't need the local PC.
# Manual (Actions → E2E → Run workflow) plus a weekly run. Flows that need a Google account can't run
# here — use guest-mode flows (they start from a fresh install and tap "Continue as guest").
on:
  workflow_dispatch:
    inputs:
      flows:
        description: "Space-separated flow files under .maestro/"
        default: "guest-mode.yaml"
        required: true
  schedule:
    - cron: "0 5 * * 1"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maestro:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FLOWS: ${{ github.event.inputs.flows || 'guest-mode.yaml' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run flows on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # ATD ("automated test device") images drop the heavyweight launcher/background apps whose ANR
          # dialog used to cover the app on boot.
          api-level: 33
          target: google_atd
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb wait-for-device && adb shell 'while [ "$(getprop sys.boot_completed)" != 1 ]; do sleep 2; done'
            sleep 20 && adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS && adb shell input keyevent KEYCODE_HOME
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            mkdir -p maestro-out/screens && for f in $FLOWS; do maestro test ".maestro/$f" --format junit --output "maestro-out/${f%.yaml}.xml" --debug-output "maestro-out/${f%.yaml}" || touch maestro-out/FAILED; done; true

      - name: Collect screenshots
        if: always()
        run: |
          # takeScreenshot paths may resolve relative to the flow file, so gather any PNGs from both places.
          mkdir -p maestro-out/screens
          find .maestro -name '*.png' -exec cp {} maestro-out/screens/ \; 2>/dev/null || true
          ls -la maestro-out/screens || true
          # Maestro debug output lives under a hidden .maestro dir that upload-artifact skips; expose it.
          mkdir -p maestro-out/debug
          find maestro-out -path '*/.maestro/tests/*' -name '*.png' -not -path 'maestro-out/debug/*' -exec cp --backup=numbered {} maestro-out/debug/ \; 2>/dev/null || true
          find maestro-out -path '*/.maestro/tests/*' -name '*.png' -path '*takeScreenshot*' -exec cp {} maestro-out/screens/ \; 2>/dev/null || true
          ls maestro-out/screens maestro-out/debug || true

      - name: Upload Maestro results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-results
          path: maestro-out/
          if-no-files-found: ignore

      - name: Report results
        if: always()
        run: |
          {
            echo "### Maestro results"
            for f in maestro-out/*.xml; do
              [ -f "$f" ] || continue
              name=$(basename "$f" .xml)
              if grep -q "<failure" "$f"; then
                echo "- ❌ $name: $(grep -o '<failure>[^<]*' "$f" | head -1 | sed 's/<failure>//')"
              else
                echo "- ✅ $name"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
          # Manual runs are used to iterate on flows: report failures in the summary without failing the run
          # (and emailing). The weekly scheduled run stays strict.
          if [ -f maestro-out/FAILED ]; then
            echo "::warning::Some Maestro flows failed — see the summary and the maestro-results artifact."
            if [ "${{ github.event_name }}" = "schedule" ]; then exit 1; fi
          fi

      - name: Remove credentials
        if: always()
        run: rm -f app/google-services.json
