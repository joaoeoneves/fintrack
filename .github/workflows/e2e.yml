name: E2E (Maestro)

# Runs Maestro flows on an Android emulator, by hand only (Actions → E2E → Run workflow): the flows tagged
# `release` by default, or a list of flows. Releases don't wait for it; screen tests run on every PR instead. Flows can't use a Google account here, so they start in guest mode.
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      flows:
        description: "Space-separated flow files under .maestro/ (empty = the flows tagged release)"
        default: ""
        required: false

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maestro:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FLOWS: ${{ github.event.inputs.flows }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # Private-repo runners have little free disk; the AVD's userdata partition didn't fit.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL" && df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run flows on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # ATD ("automated test device") images drop the heavyweight launcher/background apps whose ANR
          # dialog used to cover the app on boot.
          api-level: 33
          target: google_atd
          arch: x86_64
          profile: pixel_6
          # Private-repo runners have 2 vCPUs (public ones have 4), so the emulator boots much slower.
          cores: 2
          ram-size: 4096M
          emulator-boot-timeout: 1500
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb wait-for-device && adb shell 'while [ "$(getprop sys.boot_completed)" != 1 ]; do sleep 2; done'
            sleep 20 && adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS && adb shell input keyevent KEYCODE_HOME
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            mkdir -p maestro-out/screens && if [ -z "$FLOWS" ]; then maestro test .maestro --include-tags release --format junit --output maestro-out/release.xml --debug-output maestro-out/release || touch maestro-out/FAILED; else for f in $FLOWS; do maestro test ".maestro/$f" --format junit --output "maestro-out/${f%.yaml}.xml" --debug-output "maestro-out/${f%.yaml}" || touch maestro-out/FAILED; done; fi; true

      - name: Collect screenshots
        if: always()
        run: |
          # takeScreenshot paths may resolve relative to the flow file, so gather any PNGs from both places.
          mkdir -p maestro-out/screens
          find .maestro -name '*.png' -exec cp {} maestro-out/screens/ \; 2>/dev/null || true
          ls -la maestro-out/screens || true
          # Maestro debug output lives under a hidden .maestro dir that upload-artifact skips; expose it.
          mkdir -p maestro-out/debug
          find maestro-out -path '*/.maestro/tests/*' -name '*.png' -not -path 'maestro-out/debug/*' -exec cp --backup=numbered {} maestro-out/debug/ \; 2>/dev/null || true
          find maestro-out -path '*/.maestro/tests/*' -name '*.png' -path '*takeScreenshot*' -exec cp {} maestro-out/screens/ \; 2>/dev/null || true
          ls maestro-out/screens maestro-out/debug || true

      - name: Upload Maestro results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-results
          path: maestro-out/
          if-no-files-found: ignore

      - name: Report results
        if: always()
        run: |
          {
            echo "### Maestro results"
            for f in maestro-out/*.xml; do
              [ -f "$f" ] || continue
              name=$(basename "$f" .xml)
              if grep -q "<failure" "$f"; then
                echo "- ❌ $name: $(grep -o '<failure>[^<]*' "$f" | head -1 | sed 's/<failure>//')"
              else
                echo "- ✅ $name"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
          # Manual runs are used to iterate on flows: report failures without failing the run.
          if [ -f maestro-out/FAILED ]; then
            echo "::warning::Some Maestro flows failed — see the summary and the maestro-results artifact."
            if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then exit 1; fi
          fi

      - name: Remove credentials
        if: always()
        run: rm -f app/google-services.json
