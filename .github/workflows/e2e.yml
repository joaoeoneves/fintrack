name: E2E (Maestro)

# Runs Maestro flows on an Android emulator in GitHub Actions, so they don't need the local PC.
# Manual (Actions → E2E → Run workflow) plus a weekly run. Flows that need a Google account can't run
# here — use guest-mode flows (they start from a fresh install and tap "Continue as guest").
on:
  workflow_dispatch:
    inputs:
      flows:
        description: "Space-separated flow files under .maestro/"
        default: "guest-mode.yaml"
        required: true
  schedule:
    - cron: "0 5 * * 1"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maestro:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FLOWS: ${{ github.event.inputs.flows || 'guest-mode.yaml' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run flows on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            mkdir -p maestro-out/screens && for f in $FLOWS; do maestro test ".maestro/$f" --format junit --output "maestro-out/${f%.yaml}.xml" --debug-output "maestro-out/${f%.yaml}" || touch maestro-out/FAILED; done; test ! -f maestro-out/FAILED

      - name: Collect screenshots
        if: always()
        run: |
          # takeScreenshot paths may resolve relative to the flow file, so gather any PNGs from both places.
          mkdir -p maestro-out/screens
          find .maestro -name '*.png' -exec cp {} maestro-out/screens/ \; 2>/dev/null || true
          ls -la maestro-out/screens || true

      - name: Upload Maestro results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-results
          path: maestro-out/
          if-no-files-found: ignore

      - name: Remove credentials
        if: always()
        run: rm -f app/google-services.json
