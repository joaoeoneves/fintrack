name: Release

# Either push a vX.Y tag, or run it from Actions → Release with a version: the run builds and signs the APK, and creates the tag and the GitHub release itself.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, X.Y (e.g. 2.4)"
        required: true

permissions:
  contents: write
  checks: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Derive version from tag
        run: |
          if ! [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag '$TAG' must match vX.Y (e.g. v1.1)"
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          # versionCode = major*100 + minor, so minor must stay below 100 to keep codes unique.
          if (( 10#$minor > 99 )); then
            echo "::error::Minor version must be 0..99 (got $minor)"
            exit 1
          fi
          {
            echo "VERSION_NAME=${major}.${minor}"
            echo "VERSION_CODE=$((10#$major * 100 + 10#$minor))"
          } >> "$GITHUB_ENV"

      # CI (ci.yml, job "build") already ran ktlint, detekt, lint and the unit tests on this exact commit; the release
      # only checks that it passed (waiting while it still runs) instead of running them a second time.
      - name: Require green CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 60); do
            run=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=build" \
              --jq '.check_runs | sort_by(.started_at) | last | "\(.status) \(.conclusion)"')
            case "$run" in
              "completed success") echo "CI passed on $GITHUB_SHA"; exit 0 ;;
              completed*) echo "::error::CI on $GITHUB_SHA did not pass ($run)"; exit 1 ;;
              "null null") echo "::error::No CI run found for $GITHUB_SHA; release a commit that went through CI"; exit 1 ;;
              *) echo "CI still running ($run), waiting…"; sleep 60 ;;
            esac
          done
          echo "::error::Timed out waiting for CI on $GITHUB_SHA"
          exit 1

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::Secret GOOGLE_SERVICES_JSON_BASE64 is missing; a release needs the real Firebase config"
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json

      - name: Decode keystore
        env:
          FINTRACK_KEYSTORE_BASE64: ${{ secrets.FINTRACK_KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.FINTRACK_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.FINTRACK_KEY_ALIAS }}
          KS_KEY_PASSWORD: ${{ secrets.FINTRACK_KEY_PASSWORD }}
        run: |
          for v in FINTRACK_KEYSTORE_BASE64 KS_PASSWORD KS_ALIAS KS_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::A required signing secret is missing (FINTRACK_KEYSTORE_BASE64, FINTRACK_KEYSTORE_PASSWORD, FINTRACK_KEY_ALIAS, FINTRACK_KEY_PASSWORD)"
              exit 1
            fi
          done
          echo "$FINTRACK_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "FINTRACK_KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
            echo "FINTRACK_KEYSTORE_PASSWORD=$KS_PASSWORD"
            echo "FINTRACK_KEY_ALIAS=$KS_ALIAS"
            echo "FINTRACK_KEY_PASSWORD=$KS_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed release
        run: >
          ./gradlew assembleRelease
          -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"

      - name: Verify APK signature
        run: |
          set -o pipefail
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          # Verify on its own so a rejected/unsigned APK fails the step before anything is published.
          "$apksigner" verify "$apk"
          "$apksigner" verify --print-certs "$apk" | grep -i -m 1 "SHA-256 digest"
          cp "$apk" "FinTrack-${TAG}.apk"
          cp app/build/outputs/mapping/release/mapping.txt "FinTrack-${TAG}-mapping.txt"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "FinTrack-${TAG}.apk" "FinTrack-${TAG}-mapping.txt" --clobber
          else
            gh release create "$TAG" "FinTrack-${TAG}.apk" "FinTrack-${TAG}-mapping.txt" --title "FinTrack ${TAG}" --generate-notes --target "$GITHUB_SHA"
          fi

      - name: Remove keystore and credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" app/google-services.json
