name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; pushes to main always finish (a cancelled run still sends a notification).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The google-services Gradle plugin fails the build if app/google-services.json is missing.
      # The real file is a gitignored local credential (Firebase project agenticusage-d7ce3) and is
      # never committed. This CI job only compiles and runs JVM unit tests (against Fake repositories,
      # not real Firestore), so a placeholder with the right shape and package name is sufficient —
      # it's written here, not committed, so it can never be confused with the real credential.
      - name: Write placeholder google-services.json
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "fintrack-ci-placeholder",
              "storage_bucket": "fintrack-ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.joaoeoneves.fintrack"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "000000000000-placeholderplaceholderplacehold.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaPlaceholderPlaceholderPlaceholderPlace"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      # Robolectric downloads its android-all jars from Maven at test time; a flaky download fails every
      # Robolectric test, so keep them cached between runs.
      - name: Cache Robolectric jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}

      # The spreadsheet parity test reads a private fixture; it's skipped when the secret isn't there (forks).
      - name: Write private parity fixture
        env:
          PARITY_FIXTURE_BASE64: ${{ secrets.PARITY_FIXTURE_BASE64 }}
        run: |
          if [ -n "$PARITY_FIXTURE_BASE64" ]; then
            mkdir -p app/src/test/resources/private
            echo "$PARITY_FIXTURE_BASE64" | base64 -d > app/src/test/resources/private/spreadsheet.json
          fi

      - name: ktlint
        run: ./gradlew ktlintCheck

      - name: detekt
        run: ./gradlew detekt

      # Fails the build on lint errors only (warnings are reported, not fatal).
      - name: Android lint
        run: ./gradlew lintDebug

      - name: Unit tests
        run: ./gradlew testDebugUnitTest :core:model:test

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      # Unsigned release build: catches R8/minification-only failures on PRs.
      - name: Assemble release APK (unsigned)
        run: ./gradlew assembleRelease

      # Compile-only: generating the profile needs a device, so CI never runs it.
      - name: Compile baseline profile generator
        run: ./gradlew :baselineprofile:assemble

      - name: Remove private parity fixture
        if: always()
        run: rm -rf app/src/test/resources/private

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/ktlint
            **/build/reports/detekt
            app/build/reports/tests
            core/*/build/reports/tests
            app/build/reports/lint-results-debug.*
          retention-days: 7
