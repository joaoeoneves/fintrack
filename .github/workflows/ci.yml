name: CI

# Static checks and build/tests, as two parallel jobs. Runs on pull requests, and the Release workflow calls it on
# every release candidate (rc/vX.Y) before anything is published.
on:
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - &checkout
        uses: actions/checkout@v7

      - &setup-java
        name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Every run writes the cache, so the next release candidate starts warm.
      - &setup-gradle
        name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      # The google-services Gradle plugin fails the build if app/google-services.json is missing. The real file is
      # never committed; CI only compiles and runs JVM unit tests against fake repositories, so a placeholder with
      # the right shape and package name is enough.
      - &google-services
        name: Write placeholder google-services.json
        run: |
          # Split so the repository never holds a string shaped like a real API key.
          placeholder_key="AIza""PlaceholderPlaceholderPlaceholderPlace"
          cat > app/google-services.json <<JSON
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "fintrack-ci-placeholder",
              "storage_bucket": "fintrack-ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.joaoeoneves.fintrack"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "000000000000-placeholderplaceholderplacehold.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "${placeholder_key}"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: ktlint
        run: ./gradlew ktlintCheck

      - name: detekt
        run: ./gradlew detekt

      # Fails the build on lint errors only (warnings are reported, not fatal).
      - name: Android lint
        run: ./gradlew lintDebug

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: checks-reports
          path: |
            **/build/reports/ktlint
            **/build/reports/detekt
            app/build/reports/lint-results-debug.*
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *setup-java
      - *setup-gradle
      - *google-services

      # Robolectric downloads its android-all jars from Maven at test time; a flaky download fails every
      # Robolectric test, so keep them cached between runs.
      - name: Cache Robolectric jars
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Unit tests
        run: ./gradlew testDebugUnitTest :core:model:test

      # Compile-only for the baseline profile generator: generating the profile needs a device.
      - name: Assemble debug APK
        run: ./gradlew assembleDebug :baselineprofile:assemble

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            app/build/reports/tests
            core/*/build/reports/tests
          retention-days: 7
