name: CodeQL

# Code scanning. Kotlin is analysed from a real build (JDK 21 and the placeholder google-services.json, like CI),
# which GitHub's default setup can't do; it replaces the default setup, which must stay off for this to upload.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: actions
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        if: matrix.build-mode == 'manual'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        if: matrix.build-mode == 'manual'
        uses: gradle/actions/setup-gradle@v6

      - name: Write placeholder google-services.json
        if: matrix.build-mode == 'manual'
        run: scripts/ci/placeholder-google-services.sh

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # CodeQL only sees what is compiled during this step, so nothing may come from a cache.
      - name: Build
        if: matrix.build-mode == 'manual'
        run: >
          ./gradlew --no-daemon --no-build-cache --no-configuration-cache
          :core:model:compileKotlin :core:designsystem:compileDebugKotlin :app:compileDebugKotlin

      # Results upload only on the public repository: on a private one code scanning is a paid feature, so a run
      # there just checks that the analysis works.
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          upload: ${{ github.event.repository.private && 'never' || 'always' }}
