name: README screenshots

# Run by hand (Actions → README screenshots): takes the README screenshots with .maestro/screenshots.yaml on
# an emulator, resizes them to 540 px wide and opens a pull request that replaces docs/screenshots/.
# Uses a google_apis image: the lighter ATD image used for E2E captures black screenshots.
on: workflow_dispatch

permissions:
  contents: write
  pull-requests: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # Private-repo runners have little free disk; the AVD's userdata partition didn't fit.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL" && df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # Private-repo runners have 2 vCPUs (public ones have 4), so the emulator boots much slower.
          cores: 2
          ram-size: 4096M
          emulator-boot-timeout: 1500
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb wait-for-device && adb shell 'while [ "$(getprop sys.boot_completed)" != 1 ]; do sleep 2; done'
            sleep 30 && adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS && adb shell input keyevent KEYCODE_HOME
            adb shell settings put global sysui_demo_allowed 1
            adb shell am broadcast -a com.android.systemui.demo -e command enter
            adb shell am broadcast -a com.android.systemui.demo -e command clock -e hhmm 1200
            adb shell am broadcast -a com.android.systemui.demo -e command battery -e level 100 -e plugged false
            adb shell am broadcast -a com.android.systemui.demo -e command network -e wifi show -e level 4 -e mobile hide
            adb shell am broadcast -a com.android.systemui.demo -e command notifications -e visible false
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            maestro test .maestro/screenshots.yaml

      - name: Resize to 540 px
        run: |
          mkdir -p docs/screenshots
          for f in home activity plan plan-income savings add-expense; do
            convert "maestro-out/screens/$f.png" -resize 540x "docs/screenshots/$f.png"
          done

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f app/google-services.json
          branch="docs/screenshots-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add docs/screenshots
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "docs: refresh README screenshots"
          git push -u origin "$branch"
          gh pr create --title "docs: refresh README screenshots" --body "Taken by the README screenshots workflow (run ${GITHUB_RUN_ID})."

      - name: Remove credentials
        if: always()
        run: rm -f app/google-services.json
