name: Baseline Profile

# Regenerates app/src/main/generated/baselineProfiles on an emulator in GitHub Actions and opens a PR
# with the result, so it never needs the local emulator. Run it manually after big startup/dashboard
# changes. The generator enters guest mode, so no Google account is needed.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json

      # Runners have little free disk; the AVD's userdata partition didn't fit.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL" && df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api34-google_apis-x86_64-pixel_6-4cores

      # On a cache miss, boot once to create the AVD and save its snapshot; the real run below then reuses it.
      - name: Create AVD and snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          emulator-boot-timeout: 1500
          disk-size: 4096M
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Generate profile on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # Public-repo runners have 4 vCPUs; give them all to the emulator.
          cores: 4
          ram-size: 4096M
          emulator-boot-timeout: 1500
          disk-size: 4096M
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew :app:generateBaselineProfile

      - name: Check the profile is not obfuscated
        run: |
          p=app/src/main/generated/baselineProfiles/baseline-prof.txt
          app_rules=$(grep -c "Lcom/joaoeoneves/fintrack/" "$p" || true)
          obfuscated=$(grep -cE "^(HSPL|SPL|HPL|PL|L)[a-z0-9]{1,4};" "$p" || true)
          echo "app rules: $app_rules, obfuscated-looking rules: $obfuscated"
          if [ "$app_rules" -lt 100 ] || [ "$obfuscated" -gt 0 ]; then
            echo "::error::Generated profile looks wrong (too few app rules or obfuscated names)"
            exit 1
          fi

      - name: Open PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f app/google-services.json
          if git diff --quiet -- app/src/main/generated/baselineProfiles; then
            echo "Profile unchanged; nothing to do."
            exit 0
          fi
          branch="chore/baseline-profile-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add app/src/main/generated/baselineProfiles
          git commit -m "perf: regenerate baseline profiles"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "perf: regenerate baseline profiles" \
            --body "Generated by the Baseline Profile workflow (run ${GITHUB_RUN_ID})."

      - name: Remove credentials
        if: always()
        run: rm -f app/google-services.json
