appId: com.joaoeoneves.fintrack
---
# Plan-tab allocation/budget dialog E2E flow (B9 "Remove" button / empty-field-removes-limit, plus B4
# comma-decimal amount entry inside the dialog).
#
# Budgets moved off Home: the limit is edited from the Plan tab (Allocations card rows, and the
# "Planned vs actual" card rows once a limit exists). Assumes the app is already signed in and lands on Home -- same assumption as
# golden-path.yaml (real Google Sign-In cannot be scripted headlessly).
#
# Uses the "Investments" category (an active built-in; archived "Recurring" gets no budget row) because it has no limit set on the shared
# test account. Every limit this flow sets on it is removed again before the flow ends, so the
# budgets data is left exactly as found (the other categories' limits are never touched).
#
# "No limit" is asserted via the Allocations row's "Not planned" label (the "Planned vs actual"
# card only lists categories that have a limit).

- launchApp

# --- 0: Pin English + EUR, mirroring golden-path.yaml's steps 0/0b. Money now follows the app
# locale via NumberFormat, so English + EUR renders the limit as "€100.50" and the dialog prefill
# uses the locale's '.' separator ("100.50"). The limit is still *typed* as "100,50" to prove the
# dialog keeps accepting ',' as the decimal separator (B4) regardless of locale.
- tapOn:
    text: "Settings|Definições"
- tapOn: "English"
- back
- tapOn:
    text: "Settings|Definições"
- tapOn: "Display currency"
- tapOn: "Euro (€)"
- tapOn: "Back"
- assertVisible:
    id: "dashboard_list"

# --- 1: On the Plan tab, set a limit using a comma decimal (B4) ---
- tapOn:
    id: "nav_plan"
- scrollUntilVisible:
    element: "Allocations"
    direction: DOWN
- scrollUntilVisible:
    element: "Investments"
    direction: DOWN
- tapOn: "Investments"
- assertVisible: "Set budget for Investments"
# No limit yet, so no Remove button is offered.
- assertNotVisible: "Remove"
- tapOn: "Monthly limit"
- inputText: "100,50"
- hideKeyboard
- tapOn: "Save"
- assertNotVisible: "Set budget for Investments"
- assertVisible: ".*€100\\.50.*"

# --- 2: Reopen -- prefilled with the locale's separator, and Remove is offered (B9) ---
- tapOn: "Investments"
- assertVisible: "Set budget for Investments"
- assertVisible: "100\\.50"
- assertVisible: "Remove"
- tapOn: "Remove"
- assertNotVisible: "Set budget for Investments"
- assertNotVisible: ".*€100\\.50.*"
- assertVisible: "Not planned"

# --- 3: Set it again, then clear the field and Save -- an empty field removes the limit (B9) ---
- tapOn: "Investments"
- assertVisible: "Set budget for Investments"
- tapOn: "Monthly limit"
- inputText: "100,50"
- hideKeyboard
- tapOn: "Save"
- assertVisible: ".*€100\\.50.*"

- tapOn: "Investments"
- assertVisible: "100\\.50"
- tapOn: "100\\.50"
- eraseText: 20
- hideKeyboard
- tapOn: "Save"
- assertNotVisible: "Set budget for Investments"
- assertNotVisible: ".*€100\\.50.*"
- assertVisible: "Not planned"
# Investments is back to no limit, exactly as this flow found it.
