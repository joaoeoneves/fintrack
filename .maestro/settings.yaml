# Settings screen E2E flow for FinTrack.
#
# Assumes the app is already signed in (persisted Credential Manager / Firebase Auth session) --
# same assumption as golden-path.yaml / income-tracking.yaml, since real Google Sign-In cannot be
# scripted headlessly by Maestro. Starts and ends on the Dashboard, with theme back to Dark and
# currency back to USD before this flow ends. golden-path.yaml now pins its own EUR baseline
# independently (see its "0b" step) and no longer depends on this flow's final currency state.
# income-tracking.yaml still assumes the "$" symbol is shown and historically depended on this
# flow ending on USD -- but it now also pins its own USD baseline independently (see its own "0b"
# step), so this flow ending on USD is belt-and-suspenders at this point, not a hard dependency.
#
# Deliberately does NOT assert what the *current* display-currency label is before switching:
# the app's default fallback (fresh install / cleared app data / empty DataStore, no explicit selection
# made yet) is CurrencyOption.EUR ("Euro (€)"), but this device may already have an explicit
# USD selection persisted from a prior run of this very flow (an explicit selection is never
# retroactively changed by what the fallback default is). Asserting a fixed starting label would
# make this flow fail on a truly fresh app state. Instead, step 2 explicitly selects "US Dollar
# ($)" first to pin a known baseline regardless of starting state, then exercises the live-update
# round trip, and finishes back on USD either way.
#
# Money formatting follows the *app locale* via NumberFormat (CurrencyFormat.kt), not the currency:
# English + EUR renders "€1,330.40" (prefixed, period decimal), pt-PT + EUR renders "1330,40 €"
# (suffixed after a non-breaking space U+00A0/U+202F, comma decimal). The post-EUR assertion uses
# ".*€.*" so it matches either placement. Step 2b switches to Português to prove the locale-driven
# format; Maestro's "\s" does not match NBSP, so the regex uses "." for the separator before "€".
#
# Step 2/3 assert that switching currency/theme in Settings takes effect immediately on the
# already-running Dashboard, in the same app process, with no restart required. This depends on
# CurrencyRepository/ThemeRepository (DataStore-backed, user_preferences file) sharing one
# underlying preferences store: the repositories are bound as singletons in RepositoryModule.kt and
# read the same DataStore<Preferences> (also synced to Firestore users/{uid}/settings/preferences),
# so MainActivity's CurrencyViewModel/ThemeViewModel and SettingsViewModel all observe the same
# value stream. If a binding regresses to separate stores/instances, a write through one would
# silently stop reaching the other's collectors. See RepositoryModuleSingletonScopeTest and the
# preferences repository unit tests for the corresponding unit-level regression coverage.
appId: com.joaoeoneves.fintrack
---
- launchApp

# --- 0: Pin English first (fresh installs default to Português; the Settings entry point's label is
# itself locale-dependent, so match either), mirroring golden-path.yaml's step 0.
- tapOn:
    text: "Settings|Definições"
- tapOn: "English"
- back

# --- 1: Open Settings via the gear icon on the Dashboard ---
- assertVisible:
    id: "dashboard_list"
- tapOn: "Settings"
- assertVisible: "Settings"
- assertVisible: "Appearance"
- assertVisible: "Currency"
# "Data", "Account", and "About" all sit below the fold on a 2400px-tall viewport now: the
# Language section (added between Appearance and Currency for the language-preference feature)
# pushes everything below it further down, on top of the account-signed-in row (name + email)
# already doing the same to "About" -- scroll to each rather than asserting visible without
# moving, which is viewport-size-dependent and unrelated to the currency-default change this flow
# otherwise covers.
- scrollUntilVisible:
    element: "Data"
    direction: DOWN
- scrollUntilVisible:
    element: "Account"
    direction: DOWN
- scrollUntilVisible:
    element: "About"
    direction: DOWN

# --- 2: Currency -- pin a known USD baseline, then switch to EUR and confirm the Dashboard
# total/list reflect the new symbol live (see the header comment above for why we don't assert
# the starting label first).
- tapOn: "Display currency"
- tapOn: "US Dollar ($)"
- tapOn: "Back"
- assertVisible:
    text: "\\$.*"

- tapOn: "Settings"
- tapOn: "Display currency"
- assertVisible: "Euro (€)"
- tapOn: "Euro (€)"
- assertVisible: "Euro (€)"
- tapOn: "Back"
- assertVisible:
    text: ".*€.*"

# --- 2b: Language drives the money format -- switch to Português while on EUR and confirm the
# Dashboard renders a pt-PT amount (comma decimal, symbol suffixed after a non-breaking space,
# e.g. "12,34 €"), then switch back to English. Selecting a language recreates the activity but
# stays on Settings, so "back" returns to the Dashboard (same as step 0).
- tapOn: "Settings"
- scrollUntilVisible:
    element: "Português"
    direction: DOWN
- tapOn: "Português"
- back
- assertVisible: "Saldo líquido"
- assertVisible:
    text: ".*[0-9],[0-9]{2}.?€.*"
- tapOn: "Definições"
- scrollUntilVisible:
    element: "English"
    direction: DOWN
- tapOn: "English"
- back
- assertVisible: "Net balance"
- assertVisible:
    text: ".*€[0-9.,]+.*"

# Switch back to USD before the flow ends -- other flows assume "$".
- tapOn: "Settings"
- tapOn: "Display currency"
- tapOn: "US Dollar ($)"
- tapOn: "Back"
- assertVisible:
    text: "\\$.*"

# --- 3: Appearance -- select each theme option and confirm no crash ---
- tapOn: "Settings"
- tapOn: "Light"
- assertVisible: "Light"
# "System default" is also a Language row now (below the Appearance rows): target the theme row,
# i.e. the one above the "Language" section title.
- tapOn:
    text: "System default"
    above: "Language"
- assertVisible: "System default"
- tapOn: "Dark"
- assertVisible: "Dark"

# --- 4: Data -- Import CSV / Export CSV still launch their file pickers ---
# The Data section (with these two buttons) is below the fold at this scroll position too, for
# the same Language-section-was-added reason as step 1's scroll comment above.
# Labels now disclose the expenses-only scope of CSV import/export ("Import CSV (expenses)" /
# "Export CSV (expenses)") -- the assertVisible calls below actively prove that disclosure text
# renders on-screen, guarding against a future accidental revert to the old ambiguous
# "Import CSV"/"Export CSV" labels.
- scrollUntilVisible:
    element: "Import CSV \\(expenses\\)"
    direction: DOWN
- assertVisible: "Import CSV \\(expenses\\)"
- tapOn: "Import CSV \\(expenses\\)"
- back
- assertVisible: "Export CSV \\(expenses\\)"
- tapOn: "Export CSV \\(expenses\\)"
- back

# Return to the dashboard, leaving app state as found.
- tapOn: "Back"
