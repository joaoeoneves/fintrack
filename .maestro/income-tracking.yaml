# Income-tracking E2E flow for FinTrack.
#
# Assumes the app is already signed in (persisted Credential Manager / Firebase Auth session) —
# real Google Sign-In cannot be scripted headlessly by Maestro, so this flow starts from the
# Dashboard, same as golden-path.yaml. If the app instead shows a sign-in screen, that's a sign
# the persisted session was lost and this flow will fail fast at the "Net Balance" assertion below.
appId: com.joaoeoneves.fintrack
---
- launchApp

# --- 0: Pin language to English before any of the (English) assertions below. Fresh installs now
# default to AppLanguage.PORTUGUESE instead of AppLanguage.SYSTEM, so this flow can no longer
# assume the app renders in English out of the box. The Settings entry point's label is itself
# locale-dependent ("Settings" vs. "Definições"), so match either via regex alternation since we
# don't yet know which is currently in effect. "English" is always labeled "English" regardless
# of the active app language (see settings.yaml's currency-pinning header comment for the general
# "pin a known baseline" pattern this mirrors). No restore-to-original-language step at the end of
# this flow is needed: income-tracking.yaml doesn't restore any other global setting either
# (unlike settings.yaml, which restores theme/currency because other flows depend on those
# defaults).
- tapOn:
    text: "Settings|Definições"
- tapOn: "English"
- back

# --- 0b: Pin currency to USD before the "+$100.00" assertions below. Fresh installs now default
# to EUR, but this device may have an explicit EUR selection persisted from a prior run of
# golden-path.yaml (an explicit selection is never retroactively changed by what the fallback
# default is) -- these flows share a device/emulator and don't run in isolation, so pin a known
# baseline here explicitly rather than assuming whatever currency another flow left the device on.
# Mirrors the exact navigation pattern already used in settings.yaml's own currency-switching
# steps: open Settings, tap "Display currency" (an inline exposed-dropdown on the Settings screen
# itself, not a separate screen), tap the target currency option (selects it and closes the
# dropdown, still on Settings), then tap "Back" (the top-app-bar back arrow, content-desc "Back")
# to return directly to the Dashboard. No restore-to-original-currency step at the end of this
# flow is needed, same reasoning as the language pin above.
- tapOn:
    text: "Settings|Definições"
- tapOn: "Display currency"
- tapOn: "US Dollar ($)"
- tapOn: "Back"

# --- 1: Dashboard loads with the balance summary card (net balance + income/expenses columns) ---
- assertVisible: "FinTrack"
- assertVisible: "Net Balance"
- assertVisible: "Income"
- assertVisible: "Expenses"

# --- 2: Scroll down to the "Recent income" section and add two income entries. A second,
# distinctly-named entry ("Freelance Payment") is added alongside the original test entry so the
# All-income list below has two rows to filter and reorder between for the search/sort assertions
# in step 4b. Its amount ($50) is deliberately lower than the first entry's ($100) so that
# switching to "Highest amount" sort (AMOUNT_DESC) visibly swaps their relative order versus the
# default "Newest first" (DATE_DESC) order, giving an observable, assertable reordering.
- scrollUntilVisible:
    element: "Add income"
    direction: DOWN
- tapOn: "Add income"
- assertVisible: "Add income"
- tapOn: "Source"
- inputText: "Maestro E2E Test Salary"
- tapOn: "Amount"
- inputText: "100.00"
- hideKeyboard
- tapOn: "Save"

# Back on the dashboard, the new income should show up in "Recent income".
# IncomeRow now prefixes the amount with "+" (restyled amount text), so the row shows "+$100.00".
- assertVisible: "Maestro E2E Test Salary"
- assertVisible: "+$100.00"

- scrollUntilVisible:
    element: "Add income"
    direction: DOWN
- tapOn: "Add income"
- assertVisible: "Add income"
- tapOn: "Source"
- inputText: "Freelance Payment"
- tapOn: "Amount"
- inputText: "50.00"
- hideKeyboard
- tapOn: "Save"

- assertVisible: "Freelance Payment"
- assertVisible: "+$50.00"

# --- 3: Net balance reflects income minus expenses; expense-only figures are untouched ---
# (Dashboard net balance = income - expenses. Assertions on the exact numbers are intentionally
# left to unit tests, which cover the math precisely; this flow only asserts the feature is wired
# end-to-end and doesn't silently regress expense totals.)
- scrollUntilVisible:
    element: "Net Balance"
    direction: UP
- assertVisible: "Income"

# --- 4: Open the full income list and confirm both new income entries are there ---
# "See all income" can sit just past the Dashboard LazyColumn's clip bounds even when
# scrollUntilVisible reports it found -- tapping it there is a no-op (see swipe-delete-check.yaml's
# header comment for the full explanation). A plain extra scroll after scrollUntilVisible and
# before tapping "See all income" reliably brings it fully into view first.
- scrollUntilVisible:
    element: "See all income"
    direction: DOWN
- scroll
- tapOn: "See all income"
- assertVisible: "All income"
- assertVisible: "Maestro E2E Test Salary"
- assertVisible: "+$100.00"
- assertVisible: "Freelance Payment"
- assertVisible: "+$50.00"

# --- 4a: Default sort is "Newest first" (DATE_DESC) -- "Freelance Payment" was added after
# "Maestro E2E Test Salary" in step 2 above, so it's newer and should render above it. Maestro has
# no direct "assert list order" primitive, but assertVisible's "above"/"below" relative-position
# matchers give an exact, non-flaky substitute: they compare the matched elements' on-screen
# bounds directly, so this is a real ordering assertion, not a proxy for one.
- assertVisible:
    text: "Freelance Payment"
    above:
      text: "Maestro E2E Test Salary"

# --- 4b: Search filters the list by source (case-insensitive substring on IncomeRow's source
# field), and the empty-state message embeds the query when nothing matches.
#
# Previously this step could only type a single character ("f") because the search field's
# displayed `value` was bound to IncomeListUiState.Content.query, which only updated after a round
# trip through the ViewModel's combine(...).flatMapLatest{...} pipeline and IncomeRepository's live
# Firestore listener -- slow enough that a second fast keystroke would land before the first's
# round trip did, snapping the controlled TextField back to stale state and dropping/reordering
# every character after the first. Fixed by binding the field to IncomeListViewModel.query (a
# SavedStateHandle-backed StateFlow that updates instantly, no round trip) instead; the full
# multi-character query below now types and lands correctly.
- tapOn: "Search"
- inputText: "Freelance"
- assertVisible: "Freelance Payment"
- assertNotVisible: "Maestro E2E Test Salary"

# Clear the search back to empty and confirm both entries are visible again.
- tapOn: "Freelance"
- eraseText: 20
- hideKeyboard
- assertVisible: "Freelance Payment"
- assertVisible: "Maestro E2E Test Salary"

# --- 4c: Sort dropdown -- switch to "Highest amount" (AMOUNT_DESC) and confirm the entries swap
# relative order versus the default (since Maestro E2E Test Salary's $100 > Freelance Payment's
# $50, unlike the date-based default order asserted in 4a above), then restore the default
# ("Newest first") before proceeding, leaving app state as found.
- tapOn: "Newest first"
- assertVisible: "Highest amount"
- tapOn: "Highest amount"
- assertVisible:
    text: "Maestro E2E Test Salary"
    above:
      text: "Freelance Payment"

- tapOn: "Highest amount"
- assertVisible: "Newest first"
- tapOn: "Newest first"
- assertVisible:
    text: "Freelance Payment"
    above:
      text: "Maestro E2E Test Salary"

# --- 5: Delete both via each row's Delete affordance and confirm the undo snackbar appears ---
# Deletion is immediate (mirrors the expense list) — an undo snackbar ("Deleted "<source>"" /
# "Undo") appears. The row's trash-icon IconButton has contentDescription "Delete". With sort
# restored to "Newest first" above, "Freelance Payment" (newer) is the first "Delete" match;
# deleting it leaves "Maestro E2E Test Salary" as the next (and now only) "Delete" match.
- tapOn:
    text: "Delete"
    index: 0
- assertNotVisible: "Freelance Payment"
- assertVisible: "Undo"
- tapOn:
    text: "Delete"
    index: 0
- assertNotVisible: "Maestro E2E Test Salary"
- assertVisible: "Undo"
# Let the undo snackbars time out on their own so both income entries stay deleted.

# Return to the dashboard, leaving app state as found.
- back
- scrollUntilVisible:
    element: "Net Balance"
    direction: UP
