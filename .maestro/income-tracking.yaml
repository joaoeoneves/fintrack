# Income-tracking E2E flow for FinTrack.
#
# Assumes the app is already signed in (persisted Credential Manager / Firebase Auth session) —
# real Google Sign-In cannot be scripted headlessly by Maestro, so this flow starts from the
# Dashboard, same as golden-path.yaml. If the app instead shows a sign-in screen, that's a sign
# the persisted session was lost and this flow will fail fast at the "Net Balance" assertion below.
appId: com.joaoeoneves.fintrack
---
- launchApp

# --- 0: Pin language to English before any of the (English) assertions below. Fresh installs now
# default to AppLanguage.PORTUGUESE instead of AppLanguage.SYSTEM, so this flow can no longer
# assume the app renders in English out of the box. The Settings entry point's label is itself
# locale-dependent ("Settings" vs. "Definições"), so match either via regex alternation since we
# don't yet know which is currently in effect. "English" is always labeled "English" regardless
# of the active app language (see settings.yaml's currency-pinning header comment for the general
# "pin a known baseline" pattern this mirrors). No restore-to-original-language step at the end of
# this flow is needed: income-tracking.yaml doesn't restore any other global setting either
# (unlike settings.yaml, which restores theme/currency because other flows depend on those
# defaults).
- tapOn:
    text: "Settings|Definições"
- tapOn: "English"
- back

# --- 0b: Pin currency to USD before the "+$100.00" assertions below. Fresh installs now default
# to EUR, but this device may have an explicit EUR selection persisted from a prior run of
# golden-path.yaml (an explicit selection is never retroactively changed by what the fallback
# default is) -- these flows share a device/emulator and don't run in isolation, so pin a known
# baseline here explicitly rather than assuming whatever currency another flow left the device on.
# Mirrors the exact navigation pattern already used in settings.yaml's own currency-switching
# steps: open Settings, tap "Display currency" (an inline exposed-dropdown on the Settings screen
# itself, not a separate screen), tap the target currency option (selects it and closes the
# dropdown, still on Settings), then tap "Back" (the top-app-bar back arrow, content-desc "Back")
# to return directly to the Dashboard. No restore-to-original-currency step at the end of this
# flow is needed, same reasoning as the language pin above.
- tapOn:
    text: "Settings|Definições"
- tapOn: "Display currency"
- tapOn: "US Dollar ($)"
- tapOn: "Back"

# --- 1: Dashboard loads with the balance summary card (net balance + income/expenses columns) ---
- assertVisible: "FinTrack"
- assertVisible: "Net Balance"
- assertVisible: "Income"
- assertVisible: "Expenses"

# --- 2: Scroll down to the "Recent income" section and add an income entry ---
- scrollUntilVisible:
    element: "Add income"
    direction: DOWN
- tapOn: "Add income"
- assertVisible: "Add income"
- tapOn: "Source"
- inputText: "Maestro E2E Test Salary"
- tapOn: "Amount"
- inputText: "100.00"
- hideKeyboard
- tapOn: "Save"

# Back on the dashboard, the new income should show up in "Recent income".
# IncomeRow now prefixes the amount with "+" (restyled amount text), so the row shows "+$100.00".
- assertVisible: "Maestro E2E Test Salary"
- assertVisible: "+$100.00"

# --- 3: Net balance reflects income minus expenses; expense-only figures are untouched ---
# (Dashboard net balance = income - expenses. Assertions on the exact numbers are intentionally
# left to unit tests, which cover the math precisely; this flow only asserts the feature is wired
# end-to-end and doesn't silently regress expense totals.)
- scrollUntilVisible:
    element: "Net Balance"
    direction: UP
- assertVisible: "Income"

# --- 4: Open the full income list and confirm the new income is there ---
- scrollUntilVisible:
    element: "See all income"
    direction: DOWN
- tapOn: "See all income"
- assertVisible: "All income"
- assertVisible: "Maestro E2E Test Salary"
- assertVisible: "+$100.00"

# --- 5: Delete it via the row's Delete affordance and confirm the undo snackbar appears ---
# Deletion is immediate (mirrors the expense list) — an undo snackbar ("Deleted "<source>"" /
# "Undo") appears. The row's trash-icon IconButton has contentDescription "Delete".
- tapOn: "Delete"
- assertNotVisible: "Maestro E2E Test Salary"
- assertVisible: "Undo"
# Let the undo snackbar time out on its own so the income entry stays deleted.

# Return to the dashboard, leaving app state as found.
- back
- scrollUntilVisible:
    element: "Net Balance"
    direction: UP
