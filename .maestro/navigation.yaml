appId: com.joaoeoneves.fintrack
---
# Bottom-navigation E2E flow for FinTrack (guest mode, so it runs on CI without a Google account).
#
# Covers: the four tabs (tags nav_home / nav_activity / nav_plan / nav_insights) switch screens; a tab
# keeps its state when you leave and come back; system back from a non-Home tab root goes to Home;
# Home's "See all" (tag see_all_activity) opens the Activity tab; the bottom bar is hidden on the
# add-expense form and on Settings.
#
# Self-contained: clearState, guest mode, English pinned. It adds one expense ("Nav Test Expense") and
# deletes it again at the end; guest data is local to the device anyway.

- clearState
- launchApp

# --- 0: Sign-in -> Continue as guest -> Home; pin English so the text assertions are deterministic ---
- extendedWaitUntil:
    visible:
      id: "continue_as_guest"
    timeout: 25000
- tapOn:
    id: "continue_as_guest"
- extendedWaitUntil:
    visible:
      id: "dashboard_list"
    timeout: 15000
- tapOn:
    id: "dashboard_settings"
- tapOn: "English"
- extendedWaitUntil:
    visible: "Appearance"
    timeout: 10000
- back
- extendedWaitUntil:
    visible:
      id: "dashboard_list"
    timeout: 10000

# --- 1: The bar shows all four tabs on Home; with no data yet there is no "See all" link ---
- assertVisible:
    id: "nav_home"
- assertVisible:
    id: "nav_activity"
- assertVisible:
    id: "nav_plan"
- assertVisible:
    id: "nav_insights"
- assertVisible: "Home"
- assertVisible: "Activity"
- assertVisible: "Plan"
- assertVisible: "Insights"
- assertNotVisible:
    id: "see_all_activity"

# --- 2: Switch through the tabs ---
- tapOn:
    id: "nav_activity"
- assertVisible:
    id: "activity_list"
- assertVisible: "All expenses"
- tapOn:
    id: "nav_plan"
- assertVisible: "Add income line"
- tapOn:
    id: "nav_insights"
- assertVisible: "Change period"
- tapOn:
    id: "nav_home"
- assertVisible:
    id: "dashboard_list"

# --- 3: A tab keeps its state. Activity: pick the Income segment; Insights: pick a rolling period.
# Leave both and come back -- the choices are still there. ---
- tapOn:
    id: "nav_activity"
- tapOn: "Income"
- assertVisible: "All income"
- tapOn:
    id: "nav_insights"
- tapOn: "Change period"
- tapOn: "Last 3 months"
- assertVisible: "Last 3 months"
- tapOn:
    id: "nav_plan"
- assertVisible: "Add income line"
- tapOn:
    id: "nav_activity"
- assertVisible: "All income"
- tapOn:
    id: "nav_insights"
- assertVisible: "Last 3 months"
# Restore Insights to the current month.
- tapOn: "Change period"
- tapOn: "This month"

# --- 4: System back from a non-Home tab root goes to Home (Plan, then Activity) ---
- tapOn:
    id: "nav_plan"
- assertVisible: "Add income line"
- back
- assertVisible:
    id: "dashboard_list"
- tapOn:
    id: "nav_activity"
- assertVisible:
    id: "activity_list"
- back
- assertVisible:
    id: "dashboard_list"

# --- 5: The bar is hidden on the add-expense form and on Settings, and returns afterwards ---
- tapOn:
    id: "dashboard_add_expense"
- assertVisible: "Name"
- assertNotVisible:
    id: "nav_home"
- assertNotVisible:
    id: "nav_activity"
- assertNotVisible:
    id: "nav_plan"
- assertNotVisible:
    id: "nav_insights"
- tapOn: "Name"
- inputText: "Nav Test Expense"
- tapOn: "Amount"
- inputText: "3.21"
- hideKeyboard
- tapOn: "Save"
- extendedWaitUntil:
    visible:
      id: "dashboard_list"
    timeout: 10000
- assertVisible:
    id: "nav_home"
- tapOn:
    id: "dashboard_settings"
- assertVisible: "Appearance"
- assertNotVisible:
    id: "nav_plan"
- back
- assertVisible:
    id: "nav_plan"

# --- 6: "See all" on Home opens the Activity tab (Expenses segment) with the new expense ---
- scrollUntilVisible:
    element: "Nav Test Expense"
    direction: DOWN
- assertVisible:
    id: "see_all_activity"
- tapOn:
    id: "see_all_activity"
- assertVisible:
    id: "activity_list"
- assertVisible: "All expenses"
- assertVisible: "Nav Test Expense"

# --- 7: Clean up: delete the expense (swipe right-to-left on the search-filtered row) ---
- tapOn: "Search"
- inputText: "Nav Test Expense"
- hideKeyboard
# TODO calibrate on first CI run: y% of the single search-filtered row below the Activity segments (unverified)
- swipe:
    start: "90%, 40%"
    end: "10%, 40%"
    duration: 800
- assertVisible: "Undo"
- tapOn: "Nav Test Expense"
- eraseText: 30
- hideKeyboard
- back
- assertVisible:
    id: "dashboard_list"
