appId: com.joaoeoneves.fintrack
onFlowComplete:
  # Always restore connectivity, even if an assertion below failed mid-flow, so the shared
  # emulator is never left in airplane mode for the next flow.
  - setAirplaneMode: disabled
---
# Offline add/delete E2E flow (B1/B2): expense and income add, and delete, no longer wait for a
# server acknowledgement -- with no network, Save must close the form immediately and Delete must
# show the Undo snackbar immediately (the writes are queued in Firestore's offline cache).
#
# Assumes the app is already signed in and lands on the Dashboard -- same assumption as
# golden-path.yaml (real Google Sign-In cannot be scripted headlessly).
#
# Each entry is added and then deleted (Undo is left to time out), so once connectivity returns
# the queued add+delete pairs sync to a net no-op and Firestore is left as found.
#
# Delete buttons are targeted with a search filter first, so "Delete" index 0 can only ever be
# this flow's own row, never real data.

- launchApp

# --- 0: Pin English, mirroring golden-path.yaml's step 0 ---
- tapOn:
    text: "Settings|Definições"
- tapOn: "English"
- back
- assertVisible: "FinTrack"

- setAirplaneMode: enabled

# --- 1: Expense: add offline -> form closes, row on Dashboard ---
- scrollUntilVisible:
    element: "Add expense"
    direction: DOWN
- tapOn: "Add expense"
- assertVisible: "Add expense"
- tapOn: "Name"
- inputText: "Maestro Offline Expense"
- tapOn: "Amount"
- inputText: "7,25"
- hideKeyboard
- tapOn: "Save"
- assertVisible: "FinTrack"
- assertNotVisible: "Name"
- scrollUntilVisible:
    element: "Maestro Offline Expense"
    direction: DOWN
- assertVisible: "Maestro Offline Expense"

# --- 2: Expense: delete offline -> row gone, Undo shown immediately ---
- scrollUntilVisible:
    element: "See all expenses"
    direction: DOWN
- tapOn: "See all expenses"
- assertVisible: "All expenses"
- tapOn: "Search"
- inputText: "Maestro Offline"
- hideKeyboard
- assertVisible: "Maestro Offline Expense"
- tapOn:
    text: "Delete"
    index: 0
- assertNotVisible: "Maestro Offline Expense"
- assertVisible: "Undo"
- tapOn: "Back"

# --- 3: Income: add offline -> form closes, row on Dashboard ---
- scrollUntilVisible:
    element: "Add income"
    direction: DOWN
- tapOn: "Add income"
- assertVisible: "Add income"
- tapOn: "Source"
- inputText: "Maestro Offline Income"
- tapOn: "Amount"
- inputText: "9,75"
- hideKeyboard
- tapOn: "Save"
- assertVisible: "FinTrack"
- assertNotVisible: "Source"
- scrollUntilVisible:
    element: "Maestro Offline Income"
    direction: DOWN
- assertVisible: "Maestro Offline Income"

# --- 4: Income: delete offline -> row gone, Undo shown immediately ---
- scrollUntilVisible:
    element: "See all income"
    direction: DOWN
- scroll
- tapOn: "See all income"
- assertVisible: "All income"
- tapOn: "Search"
- inputText: "Maestro Offline"
- hideKeyboard
- assertVisible: "Maestro Offline Income"
- tapOn:
    text: "Delete"
    index: 0
- assertNotVisible: "Maestro Offline Income"
- assertVisible: "Undo"
- tapOn: "Back"
- assertVisible: "FinTrack"
