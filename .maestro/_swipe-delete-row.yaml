appId: com.joaoeoneves.fintrack
---
# Helper (not a standalone flow): swipes the only Activity row left after searching for its name.
# Use it with the list filtered to a single row; that row sits at ~59% of the screen height on the
# CI emulator (Pixel 6 profile). Coordinates are used because swiping "from" the row text did not
# dismiss it reliably (the search field contains the same text and the swipe registered as a tap).
- swipe:
    start: 92%, 59%
    end: 8%, 59%
    duration: 500
