appId: com.joaoeoneves.fintrack
---
# Helper (not a standalone flow): swipes the Activity row whose text matches ${ROW} from end to start.
# When the list is filtered by searching for the row's name, the search field matches too (it sits
# above the row), so the row is then the second match.
- runFlow:
    when:
      visible:
        text: "${ROW}"
        index: 1
    commands:
      - swipe:
          from:
            text: "${ROW}"
            index: 1
          direction: LEFT
          duration: 600
- runFlow:
    when:
      notVisible:
        text: "${ROW}"
        index: 1
    commands:
      - swipe:
          from: "${ROW}"
          direction: LEFT
          duration: 600
