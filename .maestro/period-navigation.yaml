appId: com.joaoeoneves.fintrack
---
# Period-navigation E2E flow for FinTrack: the month-based PeriodSelector on Home, the Activity
# tab's lists, the Plan tab and the Insights tab. Home and Plan are month-only (menu: "This month" /
# "Choose month..."); the rolling windows and custom range live on the Insights tab and the lists.
#
# Assumes the app is already signed in and lands on the Dashboard -- same assumption as
# golden-path.yaml (real Google Sign-In cannot be scripted headlessly).
#
# Read-only with respect to Firestore: it only changes the selected period (in-memory/saved-state
# UI state), never creates, edits or deletes any data. It ends back on "This month".
#
# Month labels are matched with a generic "<Month> <yyyy>" regex rather than a hardcoded month, so
# the flow keeps working as the calendar rolls over. Where a later step must match the *same* month
# (list screen label, budgets title), the label is captured with copyTextFrom and reused through
# ${maestro.copiedText}.

- runFlow: _guest-start.yaml

# --- 0: Pin English + EUR, mirroring golden-path.yaml's steps 0/0b.
- tapOn:
    text: "Settings|Definições"
- tapOn: "English"
- back
- tapOn:
    text: "Settings|Definições"
- tapOn: "Display currency"
- tapOn: "Euro (€)"
- tapOn: "Back"
- assertVisible:
    id: "dashboard_list"

# The month/year arrow IconButtons carry their content description ("Previous month"/"Next month",
# "Previous year"/"Next year") on the clickable button node itself, the same node that holds the
# enabled/disabled state. So the arrow checks below match `text: "<label>"` together with
# `enabled: true/false` directly on that one node.
#
# --- 1: Default is the current month: month label, both arrows, Next disabled. Home's period menu
# is month-only: no rolling windows.
- assertVisible: "[A-Z][a-z]+ [0-9]{4}"
- assertVisible:
    text: "Previous month"
    enabled: true
- assertVisible:
    text: "Next month"
    enabled: false
- tapOn: "Change period"
- assertVisible: "This month"
- assertVisible: "Choose month.*"
- assertNotVisible: "Last 3 months"
- assertNotVisible: "Custom range.*"
- tapOn: "This month"

# --- 2: Previous month -- the label changes and Next becomes enabled.
- copyTextFrom:
    text: "[A-Z][a-z]+ [0-9]{4}"
- evalScript: ${output.currentMonthLabel = maestro.copiedText}
- tapOn: "Previous month"
- assertNotVisible: ${output.currentMonthLabel}
- assertVisible: "[A-Z][a-z]+ [0-9]{4}"
- assertVisible: "Next month"
- assertVisible:
    text: "Next month"
    enabled: true
- copyTextFrom:
    text: "[A-Z][a-z]+ [0-9]{4}"
- evalScript: ${output.previousMonthLabel = maestro.copiedText}
- takeScreenshot: build/maestro/period-navigation-previous-month

# --- 3: Home's period is carried into the Activity tab. Opened via the "Recent activity" title
# (clickable, calls onOpenActivity(period)) rather than the "See all" link, which is only rendered
# when the period has activity -- the previous month may well be empty on the test account. The
# extra plain scroll brings the title fully inside the LazyColumn's clip bounds (see
# income-tracking.yaml step 4).
- scrollUntilVisible:
    element: "Recent activity"
    direction: DOWN
- scroll
- tapOn: "Recent activity"
- extendedWaitUntil:
    visible:
      id: "activity_list"
    timeout: 10000
- assertVisible: ${output.previousMonthLabel}
- assertVisible: "Next month"
- assertVisible:
    text: "Next month"
    enabled: true
- back

# --- 4: Next month returns to the current month and Next is disabled again (system back from the
# Activity tab root returns to Home).
- scrollUntilVisible:
    element: "Next month"
    direction: UP
- tapOn: "Next month"
- assertVisible: ${output.currentMonthLabel}
- assertVisible:
    text: "Next month"
    enabled: false
- scrollUntilVisible:
    element: "Change period"
    direction: UP

# --- 5: "Choose month…" -- go back one year and pick January, which is always a past month
# regardless of today's date.
- tapOn: "Change period"
- assertVisible: "This month"
- assertVisible: "Choose month.*"
- tapOn: "Choose month.*"
# The picker opens on the current year: "Next year" is disabled (no future years), "Previous year"
# is enabled.
- assertVisible:
    text: "Next year"
    enabled: false
- assertVisible:
    text: "Previous year"
    enabled: true
- tapOn: "Previous year"
# One year back, "Next year" becomes enabled.
- assertVisible:
    text: "Next year"
    enabled: true
- tapOn: "Jan"
- assertNotVisible: "Previous year"
- assertVisible: "January [0-9]{4}"
- assertVisible: "Next month"
- assertVisible:
    text: "Next month"
    enabled: true

# Cancel closes the month picker without changing the period.
- tapOn: "Change period"
- tapOn: "Choose month.*"
- assertVisible: "Previous year"
- tapOn: "Cancel"
- assertNotVisible: "Previous year"
- assertVisible: "January [0-9]{4}"

# --- 5b: Restore "This month" on Home, then move to the Insights tab, which has the full period menu.
- tapOn: "Change period"
- tapOn: "This month"
- assertVisible: ${output.currentMonthLabel}
- tapOn:
    id: "nav_insights"
- tapOn: "Change period"
- assertVisible: "This month"
- assertVisible: "Choose month.*"
- assertVisible: "Last 3 months"
- assertVisible: "Last 6 months"
- assertVisible: "Last 12 months"
- assertVisible: "Custom range.*"
- tapOn: "This month"

# --- 6: "Custom range…" opens the DateRangePicker; Cancel closes it without changing the period.
# Day cells are deliberately not tapped (their accessibility labels are date-dependent).
- tapOn: "Change period"
- tapOn: "Custom range.*"
- assertVisible: "Select dates"
- takeScreenshot: build/maestro/period-navigation-custom-range
- tapOn: "Cancel"
- assertNotVisible: "Select dates"
- assertVisible: ${output.currentMonthLabel}

# --- 7: "Last 6 months" -- the label shows the rolling window and the month arrows disappear.
- tapOn: "Change period"
- tapOn: "Last 6 months"
- assertVisible: "Last 6 months"
- assertNotVisible: "Previous month"
- assertNotVisible: "Next month"

# --- 8: Restore "This month", leaving the Insights and Home periods as found.
- tapOn: "Change period"
- tapOn: "This month"
- assertVisible: ${output.currentMonthLabel}
- assertVisible: "Previous month"
- assertVisible:
    text: "Next month"
    enabled: false
