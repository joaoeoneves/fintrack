appId: com.joaoeoneves.fintrack
---
# Period-navigation E2E flow for FinTrack: the month-based PeriodSelector that replaced the old
# 1W/1M/3M/6M/1Y chips on the Dashboard and the expense/income lists.
#
# Assumes the app is already signed in and lands on the Dashboard -- same assumption as
# golden-path.yaml (real Google Sign-In cannot be scripted headlessly).
#
# Read-only with respect to Firestore: it only changes the selected period (in-memory/saved-state
# UI state), never creates, edits or deletes any data. It ends back on "This month".
#
# Month labels are matched with a generic "<Month> <yyyy>" regex rather than a hardcoded month, so
# the flow keeps working as the calendar rolls over. Where a later step must match the *same* month
# (list screen label, budgets title), the label is captured with copyTextFrom and reused through
# ${maestro.copiedText}.

- launchApp

# --- 0: Pin English + EUR, mirroring golden-path.yaml's steps 0/0b.
- tapOn:
    text: "Settings|Definições"
- tapOn: "English"
- back
- tapOn:
    text: "Settings|Definições"
- tapOn: "Display currency"
- tapOn: "Euro (€)"
- tapOn: "Back"
- assertVisible: "FinTrack"

# The "Next month" content description lives on the IconButton's inner Icon node, which Maestro
# always reports as enabled; the enabled/disabled state is on the clickable IconButton parent. So the
# enabled checks below target that direct parent via containsChild instead of the icon text itself.
# Maestro 2.6.1 never matches `enabled: true` combined with containsChild (even on an enabled
# button), so "Next is enabled" is asserted as "the disabled Next button is not visible".
#
# --- 1: Default is the current month: month label, both arrows, Next disabled, budgets title
# "Budgets (this month)".
- assertVisible: "[A-Z][a-z]+ [0-9]{4}"
- assertVisible: "Previous month"
- assertVisible:
    enabled: false
    containsChild: "Next month"
- scrollUntilVisible:
    element: "Budgets \\(this month\\)"
    direction: DOWN
- scrollUntilVisible:
    element: "Previous month"
    direction: UP

# --- 2: Previous month -- the label changes, Next becomes enabled, and the budgets title names the
# selected month.
- copyTextFrom:
    text: "[A-Z][a-z]+ [0-9]{4}"
- evalScript: ${output.currentMonthLabel = maestro.copiedText}
- tapOn: "Previous month"
- assertNotVisible: ${output.currentMonthLabel}
- assertVisible: "[A-Z][a-z]+ [0-9]{4}"
- assertVisible: "Next month"
- assertNotVisible:
    enabled: false
    containsChild: "Next month"
- copyTextFrom:
    text: "[A-Z][a-z]+ [0-9]{4}"
- evalScript: ${output.previousMonthLabel = maestro.copiedText}
- takeScreenshot: build/maestro/period-navigation-previous-month
- scrollUntilVisible:
    element: "Budgets \\(${output.previousMonthLabel}\\)"
    direction: DOWN
- assertNotVisible: "Budgets \\(this month\\)"

# --- 3: The Dashboard's period is carried into the expense list. Opened via the "Recent expenses"
# card header (the whole header row is clickable and calls onOpenList(period)) rather than the
# "See all expenses" link, which is only rendered when the period has expenses -- the previous
# month may well be empty on the test account. The extra plain scroll brings the header fully
# inside the LazyColumn's clip bounds (see income-tracking.yaml step 4).
- scrollUntilVisible:
    element: "Recent expenses"
    direction: DOWN
- scroll
- tapOn: "Recent expenses"
- assertVisible: "All expenses"
- assertVisible: ${output.previousMonthLabel}
- assertVisible: "Next month"
- assertNotVisible:
    enabled: false
    containsChild: "Next month"
- back

# --- 4: Next month returns to the current month: "Budgets (this month)" and Next disabled again.
- scrollUntilVisible:
    element: "Next month"
    direction: UP
- tapOn: "Next month"
- assertVisible: ${output.currentMonthLabel}
- assertVisible:
    enabled: false
    containsChild: "Next month"
- scrollUntilVisible:
    element: "Budgets \\(this month\\)"
    direction: DOWN
- scrollUntilVisible:
    element: "Change period"
    direction: UP

# --- 5: "Choose month…" -- go back one year and pick January, which is always a past month
# regardless of today's date.
- tapOn: "Change period"
- assertVisible: "This month"
- assertVisible: "Choose month.*"
- assertVisible: "Last 3 months"
- assertVisible: "Last 6 months"
- assertVisible: "Last 12 months"
- assertVisible: "Custom range.*"
- tapOn: "Choose month.*"
- assertVisible: "Previous year"
- assertVisible: "Next year"
- tapOn: "Previous year"
- tapOn: "Jan"
- assertNotVisible: "Previous year"
- assertVisible: "January [0-9]{4}"
- assertVisible: "Next month"
- assertNotVisible:
    enabled: false
    containsChild: "Next month"

# Cancel closes the month picker without changing the period.
- tapOn: "Change period"
- tapOn: "Choose month.*"
- assertVisible: "Previous year"
- tapOn: "Cancel"
- assertNotVisible: "Previous year"
- assertVisible: "January [0-9]{4}"

# --- 6: "Custom range…" opens the DateRangePicker; Cancel closes it without changing the period.
# Day cells are deliberately not tapped (their accessibility labels are date-dependent).
- tapOn: "Change period"
- tapOn: "Custom range.*"
- assertVisible: "Select dates"
- takeScreenshot: build/maestro/period-navigation-custom-range
- tapOn: "Cancel"
- assertNotVisible: "Select dates"
- assertVisible: "January [0-9]{4}"

# --- 7: "Last 6 months" -- the label shows the rolling window and the month arrows disappear.
- tapOn: "Change period"
- tapOn: "Last 6 months"
- assertVisible: "Last 6 months"
- assertNotVisible: "Previous month"
- assertNotVisible: "Next month"

# --- 8: Restore "This month", leaving the Dashboard as found.
- tapOn: "Change period"
- tapOn: "This month"
- assertVisible: ${output.currentMonthLabel}
- assertVisible: "Previous month"
- assertVisible:
    enabled: false
    containsChild: "Next month"
