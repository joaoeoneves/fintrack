appId: com.joaoeoneves.fintrack
---
# Guest-mode E2E flow for FinTrack.
#
# REQUIRES a signed-out app state (e.g. run after `clearState`, or after signing out), because it
# starts on the sign-in screen. It does NOT need a Google account -- guest mode is the one path
# Maestro can script end-to-end without real Google Sign-In. Data stays only on the device (local
# JSON store), so no Firestore cleanup is needed; the flow still deletes its own expense at the end.
# Run on its own (it leaves the app in guest mode, i.e. NOT in the signed-in state the other flows
# assume).
#
# A fresh install follows the system locale (English on the CI emulator, but PT on a PT device), so the sign-in screen text is matched with EN|PT regex
# alternation until English is pinned from Settings below.

- clearState
- launchApp

# --- 1: Sign-in screen -> Continue as guest -> Dashboard ---
- extendedWaitUntil:
    visible:
      id: "continue_as_guest"
    timeout: 20000
- tapOn:
    id: "continue_as_guest"
- extendedWaitUntil:
    visible:
      id: "dashboard_list"
    timeout: 15000
- assertVisible: "Net balance|Saldo líquido.*"

# Pin English + EUR so the assertions below are deterministic. The Settings button is a top-bar
# icon (tag dashboard_settings, always on screen). Language rows are plain choice rows ("English");
# the currency row is "Display currency" and opens a dropdown whose items read "Euro (€)".
- tapOn:
    id: "dashboard_settings"
- tapOn: "English"
# Language change recreates the activity; wait for an English-only label at the top of Settings,
# then scroll: the Currency group sits below the Appearance + Language lists, below the fold.
- extendedWaitUntil:
    visible: "Appearance"
    timeout: 10000
- scrollUntilVisible:
    element: "Display currency"
    direction: DOWN
- tapOn: "Display currency"
- tapOn: "Euro \\(€\\)"
- tapOn: "Back"
- assertVisible: "Net balance"

# --- 2: Add an expense via the floating add pill (tag dashboard_add_expense) ---
- tapOn:
    id: "dashboard_add_expense"
- tapOn: "Name"
- inputText: "Maestro Guest Expense"
- tapOn: "Amount"
- inputText: "7.77"
- hideKeyboard
- tapOn: "Save"
- scrollUntilVisible:
    element: "Maestro Guest Expense"
    direction: DOWN
- assertVisible: "Maestro Guest Expense"
- assertVisible: "[-−]€7\\.77"

# --- 3: Restart the app (no clearState) -- guest session and data persist ---
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "dashboard_list"
    timeout: 15000
- assertNotVisible:
    id: "continue_as_guest"
- scrollUntilVisible:
    element: "Maestro Guest Expense"
    direction: DOWN
- assertVisible: "[-−]€7\\.77"

# --- 4: Settings -> Leave guest mode -> confirm -> back on the sign-in screen ---
- tapOn:
    id: "dashboard_settings"
- scrollUntilVisible:
    element: "Guest.*data is stored only on this device"
    direction: DOWN
- scrollUntilVisible:
    element: "Leave guest mode"
    direction: DOWN
- assertVisible: "Sign in to sync"
- tapOn: "Leave guest mode"
- assertVisible: "Leave guest mode\\?"
# The dialog's confirm button shares its label with the card button behind it; target the one
# rendered below the dialog title.
- tapOn:
    text: "Leave guest mode"
    below: "Leave guest mode\\?"
- extendedWaitUntil:
    visible:
      id: "continue_as_guest"
    timeout: 10000
- assertVisible: "Sign in with Google"

# --- 5: Continue as guest again -- the expense is still there ---
- tapOn:
    id: "continue_as_guest"
- extendedWaitUntil:
    visible:
      id: "dashboard_list"
    timeout: 15000
- scrollUntilVisible:
    element: "Maestro Guest Expense"
    direction: DOWN
- assertVisible: "[-−]€7\\.77"

# --- 6: Clean up -- delete the expense via the full list (delete is swipe-only, right-to-left) ---
- scrollUntilVisible:
    element:
      id: "see_all_activity"
    direction: DOWN
- tapOn:
    id: "see_all_activity"
# Filter first so only this row exists in the list.
- tapOn: "Search"
- inputText: "Maestro Guest Expense"
- hideKeyboard
- assertVisible: "[-−]€7\\.77"
- runFlow:
    file: _swipe-delete-row.yaml
    env:
      ROW: "Maestro Guest Expense"
- assertNotVisible: "[-−]€7\\.77"
- back
