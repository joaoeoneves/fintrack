appId: com.joaoeoneves.fintrack
---
# README screenshots flow (updated for 5.0; guest mode, English, EUR, dark, demo data only). NOT a regression gate.
# Four tabs: Home, Activity, Income, Spending. Groups/Recurring live in the Spending tab, the salary
# profile in the Income tab, the investments page behind Home's "Invested" row.
# Run locally on a 1080x2400 / 420 dpi emulator (adb shell wm size 1080x2400; adb shell wm density 420;
# reset with wm size reset / wm density reset) with SystemUI demo mode on (clock 12:00, full battery, wifi,
# no notifications) and resize the PNGs in maestro-out/screens/ to 540 px wide:
#   maestro test .maestro/screenshots.yaml
# Captures: home, activity (period selector + summary line, unscrolled), income, spending, investments, add-expense.
# Money inputs are cash-register style: digits only ("6420" = 64.20). `back` closes only the IME when
# it is up; Save is tapped directly.

- runFlow: _guest-start.yaml

# --- Pin English + EUR + Dark ---
- tapOn:
    id: "account_avatar"
- tapOn: "Language|Idioma"
# Index -1 = the open menu's option (the row's own value can also read "English").
- tapOn:
    text: "English"
    index: -1
- extendedWaitUntil:
    visible: "Preferences"
    timeout: 10000
- tapOn: "Theme"
- tapOn:
    text: "Dark"
    index: -1
- scrollUntilVisible:
    element: "Currency"
    direction: DOWN
- tapOn: "Currency"
- tapOn:
    text: "Euro \\(€\\)"
    index: -1
- back
- extendedWaitUntil:
    visible:
      id: "dashboard_list"
    timeout: 10000

# --- Income tab: the salary wizard (1500 gross, 15% IRS, 50% subsidies, meal allowance) ---
- tapOn:
    id: "nav_income"
- extendedWaitUntil:
    visible: "Salary profile"
    timeout: 10000
- tapOn: "Salary profile"
- tapOn: "Gross base salary \\(monthly\\)"
- inputText: "150000"
- back
- tapOn: "IRS withholding rate \\(%\\)"
- inputText: "15"
- back
- tapOn: "Next"
- scrollUntilVisible:
    element: "Next"
    centerElement: true
- tapOn: "Next"
- tapOn: "Meal allowance per working day"
- inputText: "763"
- back
- tapOn: "Next"
- tapOn: "Save"
- extendedWaitUntil:
    visible: "Expected income"
    timeout: 10000

# --- Spending tab > New group: Food, Shopping, Rent (name + categories) ---
- tapOn:
    id: "nav_spending"
- scrollUntilVisible:
    element: "New group"
- tapOn: "New group"
- tapOn: "Name"
- inputText: "Food"
- back
- tapOn: "Add category"
- tapOn:
    text: "Food"
    index: -1
- tapOn: "Save"
- extendedWaitUntil:
    visible: "By group"
    timeout: 10000
- scrollUntilVisible:
    element: "New group"
- tapOn: "New group"
- tapOn: "Name"
- inputText: "Shopping"
- back
- tapOn: "Add category"
- tapOn:
    text: "Shopping"
    index: -1
- tapOn: "Save"
- extendedWaitUntil:
    visible: "By group"
    timeout: 10000

# --- Spending tab > Recurring: Rent and Internet ---
- scrollUntilVisible:
    element: "Recurring"
- tapOn: "Recurring"
- tapOn: "Add recurring"
- inputText: "75000"
- tapOn: "Name"
- inputText: "Rent"
- back
- tapOn: "Transfer"
- tapOn: "Save"
- extendedWaitUntil:
    visible: "Add recurring"
    timeout: 10000
- tapOn: "Add recurring"
- inputText: "3999"
- tapOn: "Name"
- inputText: "Internet"
- back
- tapOn: "Shopping"
- tapOn: "Save"
- extendedWaitUntil:
    visible: "Internet"
    timeout: 10000
- back

# Rent is already booked by the Bills entry above, so it is not added again as an expense.
# --- Income + expenses, spread over different earlier days of the month (the date picker in the form)
# so the Home balance chart has a real shape. Today is never used; days 1..25 exist in any month.
- tapOn:
    id: "nav_home"
- extendedWaitUntil:
    visible:
      id: "dashboard_list"
    timeout: 10000
- tapOn: "Add income"
- inputText: "140000"
- tapOn: "Name"
- inputText: "Freelance"
- back
- scrollUntilVisible:
    element: "Date"
- tapOn: "Date"
- tapOn:
    text: "\\w+, \\w+ 1, 20\\d\\d"
- tapOn: "OK"
- tapOn: "Save"
- extendedWaitUntil:
    visible:
      id: "dashboard_list"
    timeout: 10000
- tapOn: "Add expense"
- inputText: "6420"
- tapOn: "Name"
- inputText: "Groceries"
- back
- tapOn: "Food"
- scrollUntilVisible:
    element: "Date"
- tapOn: "Date"
- tapOn:
    text: "\\w+, \\w+ 5, 20\\d\\d"
- tapOn: "OK"
- tapOn: "Save"
- extendedWaitUntil:
    visible:
      id: "dashboard_list"
    timeout: 10000
- tapOn: "Add expense"
- inputText: "1850"
- tapOn: "Name"
- inputText: "Cinema"
- back
- tapOn: "Shopping"
- scrollUntilVisible:
    element: "Date"
- tapOn: "Date"
- tapOn:
    text: "\\w+, \\w+ 8, 20\\d\\d"
- tapOn: "OK"
- tapOn: "Save"
- extendedWaitUntil:
    visible:
      id: "dashboard_list"
    timeout: 10000
- tapOn: "Add expense"
- inputText: "5130"
- tapOn: "Name"
- inputText: "Groceries"
- back
- tapOn: "Food"
- scrollUntilVisible:
    element: "Date"
- tapOn: "Date"
- tapOn:
    text: "\\w+, \\w+ 12, 20\\d\\d"
- tapOn: "OK"
- tapOn: "Save"
- extendedWaitUntil:
    visible:
      id: "dashboard_list"
    timeout: 10000
- tapOn: "Add expense"
- inputText: "1280"
- tapOn: "Name"
- inputText: "Lunch"
- back
- tapOn: "Food"
- scrollUntilVisible:
    element: "Date"
- tapOn: "Date"
- tapOn:
    text: "\\w+, \\w+ 19, 20\\d\\d"
- tapOn: "OK"
- tapOn: "Save"
- extendedWaitUntil:
    visible:
      id: "dashboard_list"
    timeout: 10000
- tapOn: "Add expense"
- inputText: "3600"
- tapOn: "Name"
- inputText: "Dinner out"
- back
- tapOn: "Food"
- scrollUntilVisible:
    element: "Date"
- tapOn: "Date"
- tapOn:
    text: "\\w+, \\w+ 24, 20\\d\\d"
- tapOn: "OK"
- tapOn: "Save"
- extendedWaitUntil:
    visible:
      id: "dashboard_list"
    timeout: 10000

# One investment (day 2) so Home shows the "Invested" row that opens the investments page.
- tapOn: "Add expense"
- inputText: "10000"
- tapOn: "Name"
- inputText: "ETF"
- back
- tapOn: "Investments"
- scrollUntilVisible:
    element: "Date"
- tapOn: "Date"
- tapOn:
    text: "\\w+, \\w+ 2, 20\\d\\d"
- tapOn: "OK"
- tapOn: "Save"
- extendedWaitUntil:
    visible:
      id: "dashboard_list"
    timeout: 10000

# --- Screenshots ---
- tapOn:
    text: "Dismiss"
    optional: true
# Back to the very top of Home (the list keeps its scroll position).
- repeat:
    times: 8
    commands:
      - swipe:
          start: 50%,25%
          end: 50%,85%
          duration: 250
- waitForAnimationToEnd
- takeScreenshot: maestro-out/screens/home
- tapOn:
    id: "nav_activity"
- extendedWaitUntil:
    visible:
      id: "activity_list"
    timeout: 10000
# Unscrolled: the period selector, the one-line "Spent X · Received Y" summary and the source chips; the add pill only overlaps
# the category chip row, never a transaction row.
- waitForAnimationToEnd
- takeScreenshot: maestro-out/screens/activity
- tapOn:
    id: "nav_income"
- waitForAnimationToEnd
- takeScreenshot: maestro-out/screens/income
- tapOn: "Year"
- waitForAnimationToEnd
- takeScreenshot: maestro-out/screens/income-year
- tapOn: "Month"
- tapOn:
    id: "nav_spending"
- waitForAnimationToEnd
- takeScreenshot: maestro-out/screens/spending
- tapOn: "Year"
- waitForAnimationToEnd
- takeScreenshot: maestro-out/screens/spending-year
- tapOn: "Month"
- tapOn:
    id: "nav_home"
- extendedWaitUntil:
    visible:
      id: "dashboard_list"
    timeout: 10000
- tapOn: "Add expense"
- waitForAnimationToEnd
- inputText: "4200"
- tapOn: "Name"
- inputText: "Dinner"
- back
- waitForAnimationToEnd
- takeScreenshot: maestro-out/screens/add-expense
# Investments page last (relaunch drops the add-expense form; a back press from the page right after
# switching tabs exits the app in 5.0, so the flow ends on it).
- launchApp
- tapOn:
    id: "nav_home"
- extendedWaitUntil:
    visible:
      id: "dashboard_list"
    timeout: 10000
- scrollUntilVisible:
    element: "Invested.*"
- tapOn: "Invested.*"
- waitForAnimationToEnd
- takeScreenshot: maestro-out/screens/investments
