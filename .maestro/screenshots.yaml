appId: com.joaoeoneves.fintrack
---
# README screenshots flow for 3.0 (guest mode, English, EUR, dark, demo data only). NOT a regression gate.
# Run locally on a ~1080x2400 emulator with SystemUI demo mode on (clock 12:00, full battery, wifi,
# no notifications) and resize the PNGs in maestro-out/screens/ to 540 px wide:
#   maestro test .maestro/screenshots.yaml
# Captures: home, activity (summary expanded), plan, plan-income, savings, add-expense.
# Money inputs are cash-register style: digits only ("6420" = 64.20). `back` closes only the IME when
# it is up; Save is tapped directly.

- runFlow: _guest-start.yaml

# --- Pin English + EUR + Dark ---
- tapOn:
    id: "account_avatar"
- tapOn: "Language|Idioma"
# Index -1 = the open menu's option (the row's own value can also read "English").
- tapOn:
    text: "English"
    index: -1
- extendedWaitUntil:
    visible: "Preferences"
    timeout: 10000
- tapOn: "Theme"
- tapOn:
    text: "Dark"
    index: -1
- scrollUntilVisible:
    element: "Currency"
    direction: DOWN
- tapOn: "Currency"
- tapOn:
    text: "Euro \\(€\\)"
    index: -1
- back
- extendedWaitUntil:
    visible:
      id: "dashboard_list"
    timeout: 10000

# --- Plan > Set up > Income: the salary wizard (1500 gross, 15% IRS, 50% subsidies, meal allowance) ---
- tapOn:
    id: "nav_plan"
- scrollUntilVisible:
    element: "Set up"
- scroll
- tapOn:
    text: "Income"
    index: -1
- extendedWaitUntil:
    visible: "Salary profile"
    timeout: 10000
- tapOn: "Salary profile"
- tapOn: "Gross base salary \\(monthly\\)"
- inputText: "150000"
- back
- tapOn: "IRS withholding rate \\(%\\)"
- inputText: "15"
- back
- tapOn: "Next"
- scrollUntilVisible:
    element: "Next"
    centerElement: true
- tapOn: "Next"
- tapOn: "Meal allowance per working day"
- inputText: "763"
- back
- tapOn: "Next"
- tapOn: "Save"
# Back on the Income screen: one row per salary component.
- extendedWaitUntil:
    visible: "From salary profile"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: maestro-out/screens/plan-income
- back

# --- Plan > Set up > Envelopes: Food 300, Shopping 150, Rent 750 ---
- scrollUntilVisible:
    element: "Set up"
- scroll
- tapOn:
    text: "Envelopes"
    index: -1
- tapOn: "New envelope"
- tapOn: "Name"
- inputText: "Food"
- back
- tapOn: "Monthly amount"
- inputText: "30000"
- back
- tapOn: "Add category"
- tapOn:
    text: "Food"
    index: -1
- tapOn: "Save"
- extendedWaitUntil:
    visible: "New envelope"
    timeout: 10000
- tapOn: "New envelope"
- tapOn: "Name"
- inputText: "Shopping"
- back
- tapOn: "Monthly amount"
- inputText: "15000"
- back
- tapOn: "Add category"
- tapOn:
    text: "Shopping"
    index: -1
- tapOn: "Save"
- extendedWaitUntil:
    visible: "New envelope"
    timeout: 10000
- tapOn: "New envelope"
- tapOn: "Name"
- inputText: "Rent"
- back
- tapOn: "Monthly amount"
- inputText: "75000"
- back
- tapOn: "Add category"
- tapOn:
    text: "Transfer"
    index: -1
- tapOn: "Save"
- extendedWaitUntil:
    visible: "New envelope"
    timeout: 10000
- back

# --- Plan > Set up > Bills: Rent and Internet ---
- scrollUntilVisible:
    element: "Set up"
- scroll
- tapOn:
    text: "Bills"
    index: -1
- tapOn: "Add recurring"
- inputText: "75000"
- tapOn: "Name"
- inputText: "Rent"
- back
- tapOn: "Transfer"
- tapOn: "Save"
- extendedWaitUntil:
    visible: "Add recurring"
    timeout: 10000
- tapOn: "Add recurring"
- inputText: "3999"
- tapOn: "Name"
- inputText: "Internet"
- back
- tapOn: "Shopping"
- tapOn: "Save"
- extendedWaitUntil:
    visible: "Internet"
    timeout: 10000
- back

# --- Savings: one plan with a target ---
- tapOn:
    id: "nav_savings"
- tapOn: "New plan"
- tapOn: "Name"
- inputText: "Holiday fund"
- back
- tapOn: "Monthly amount"
- inputText: "10000"
- back
- scrollUntilVisible:
    element: "Target"
    centerElement: true
- tapOn: "Target"
- inputText: "120000"
- back
- tapOn: "Total"
- tapOn: "Save"
- extendedWaitUntil:
    visible: "Holiday fund"
    timeout: 10000

# --- Income + expenses (Home's floating add pill) ---
- tapOn:
    id: "nav_home"
- extendedWaitUntil:
    visible:
      id: "dashboard_list"
    timeout: 10000
- tapOn: "Add income"
- inputText: "140000"
- tapOn: "Source"
- inputText: "Freelance"
- back
- tapOn: "Save"
- extendedWaitUntil:
    visible:
      id: "dashboard_list"
    timeout: 10000
- tapOn: "Add expense"
- inputText: "6420"
- tapOn: "Name"
- inputText: "Groceries"
- back
- tapOn: "Food"
- tapOn: "Save"
- extendedWaitUntil:
    visible:
      id: "dashboard_list"
    timeout: 10000
- tapOn: "Add expense"
- inputText: "1850"
- tapOn: "Name"
- inputText: "Cinema"
- back
- tapOn: "Shopping"
- tapOn: "Save"
- extendedWaitUntil:
    visible:
      id: "dashboard_list"
    timeout: 10000
- tapOn: "Add expense"
- inputText: "1280"
- tapOn: "Name"
- inputText: "Lunch"
- back
- tapOn: "Food"
- tapOn: "Save"
- extendedWaitUntil:
    visible:
      id: "dashboard_list"
    timeout: 10000

# --- Screenshots ---
- tapOn: "Dismiss"
- scrollUntilVisible:
    element: "Net balance"
    direction: UP
- waitForAnimationToEnd
- takeScreenshot: maestro-out/screens/home
- tapOn:
    id: "nav_activity"
- extendedWaitUntil:
    visible:
      id: "activity_list"
    timeout: 10000
- scrollUntilVisible:
    element: "Show breakdown"
- tapOn: "Show breakdown"
- scrollUntilVisible:
    element: "Spent"
    direction: UP
- waitForAnimationToEnd
- takeScreenshot: maestro-out/screens/activity
- tapOn:
    id: "nav_plan"
- waitForAnimationToEnd
# The Plan tab keeps its scroll position: swipe back to the top.
- repeat:
    times: 4
    commands:
      - swipe:
          direction: DOWN
- waitForAnimationToEnd
- takeScreenshot: maestro-out/screens/plan
- tapOn:
    id: "nav_savings"
- waitForAnimationToEnd
- takeScreenshot: maestro-out/screens/savings
- tapOn:
    id: "nav_home"
- extendedWaitUntil:
    visible:
      id: "dashboard_list"
    timeout: 10000
- tapOn: "Add expense"
- waitForAnimationToEnd
- inputText: "4200"
- tapOn: "Name"
- inputText: "Dinner"
- back
- waitForAnimationToEnd
- takeScreenshot: maestro-out/screens/add-expense
