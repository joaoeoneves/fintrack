appId: com.joaoeoneves.fintrack
---
# README screenshots, part 2 (run by scripts/screenshots.sh after .maestro/screenshots-setup.yaml and the demo
# data): opens the app on the demo year and captures the screens the README shows. NOT a regression gate.
# Each tab keeps its own period: Month views step back to the previous, complete month.

- launchApp
- extendedWaitUntil:
    visible:
      id: "dashboard_list"
    timeout: 15000
# The Get started card is done apart from the payday step; hide it and let its snackbar go.
- tapOn:
    text: "Dismiss"
    optional: true
- extendedWaitUntil:
    notVisible: ".*hidden"
    timeout: 10000
- tapOn: "Previous month"
- waitForAnimationToEnd
- takeScreenshot: maestro-out/screens/home

- tapOn:
    id: "nav_activity"
- extendedWaitUntil:
    visible:
      id: "activity_list"
    timeout: 10000
- tapOn: "Previous month"
- waitForAnimationToEnd
- takeScreenshot: maestro-out/screens/activity

- tapOn:
    id: "nav_income"
- tapOn: "Previous month"
- waitForAnimationToEnd
- takeScreenshot: maestro-out/screens/income
- tapOn: "Year"
- waitForAnimationToEnd
- takeScreenshot: maestro-out/screens/income-year
- tapOn: "Month"

- tapOn:
    id: "nav_spending"
- tapOn: "Previous month"
- waitForAnimationToEnd
- takeScreenshot: maestro-out/screens/spending
- tapOn: "Year"
- waitForAnimationToEnd
- takeScreenshot: maestro-out/screens/spending-year
- tapOn: "Month"

- tapOn:
    id: "nav_home"
- extendedWaitUntil:
    visible:
      id: "dashboard_list"
    timeout: 10000
- tapOn: "Add expense"
- waitForAnimationToEnd
- inputText: "1840"
- tapOn: "Name"
- inputText: "Lunch"
- hideKeyboard
- scrollUntilVisible:
    element: "Paid with meal card"
- tapOn: "Paid with meal card"
- waitForAnimationToEnd
- takeScreenshot: maestro-out/screens/add-expense
