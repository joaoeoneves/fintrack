appId: com.joaoeoneves.fintrack
---
# README screenshots flow (guest mode, English, EUR, dark, demo data only). NOT a regression gate.
# Run locally on a ~1080x2400 emulator with SystemUI demo mode on (clock 12:00, full battery, wifi,
# no notifications) and resize the PNGs in maestro-out/screens/ to 540 px wide:
#   maestro test .maestro/screenshots.yaml
# Captures: home, activity, plan, plan-income, insights, add-expense.
# Soft keyboards: `back` closes only the IME when it is up; Save is tapped directly in sheets.

- runFlow: _guest-start.yaml

# --- Pin English + EUR + Dark ---
- tapOn:
    id: "dashboard_settings"
- tapOn: "Language|Idioma"
# Index -1 = the open menu's option (the row's own value can also read "English").
- tapOn:
    text: "English"
    index: -1
- extendedWaitUntil:
    visible: "Preferences"
    timeout: 10000
- tapOn: "Theme"
- tapOn:
    text: "Dark"
    index: -1
- scrollUntilVisible:
    element: "Currency"
    direction: DOWN
- tapOn: "Currency"
- tapOn:
    text: "Euro \\(€\\)"
    index: -1
- back
- extendedWaitUntil:
    visible:
      id: "dashboard_list"
    timeout: 10000

# --- Expenses (Food, Shopping, Transfer, Investments) ---
- repeat:
    times: 1
    commands:
      - tapOn:
          id: "dashboard_add_expense"
      - inputText: "64.20"
      - tapOn: "Name"
      - inputText: "Groceries"
      - back
      - tapOn: "Food"
      - tapOn: "Save"
      - extendedWaitUntil:
          visible:
            id: "dashboard_list"
          timeout: 10000
- tapOn:
    id: "dashboard_add_expense"
- inputText: "750"
- tapOn: "Name"
- inputText: "Rent"
- back
- tapOn: "Transfer"
- tapOn: "Save"
- extendedWaitUntil:
    visible:
      id: "dashboard_list"
    timeout: 10000
- tapOn:
    id: "dashboard_add_expense"
- inputText: "18.50"
- tapOn: "Name"
- inputText: "Cinema"
- back
- tapOn: "Shopping"
- tapOn: "Save"
- extendedWaitUntil:
    visible:
      id: "dashboard_list"
    timeout: 10000
- tapOn:
    id: "dashboard_add_expense"
- inputText: "200"
- tapOn: "Name"
- inputText: "Savings"
- back
- tapOn: "Investments"
- tapOn: "Save"
- extendedWaitUntil:
    visible:
      id: "dashboard_list"
    timeout: 10000

# --- Income ---
- tapOn: "Add income"
- inputText: "1400"
- tapOn: "Source"
- inputText: "Freelance"
- tapOn: "Save"
- extendedWaitUntil:
    visible:
      id: "dashboard_list"
    timeout: 10000

# --- Plan: salary profile (1500 base, 15% IRS, meal allowance, one extra) ---
- tapOn:
    id: "nav_plan"
- scrollUntilVisible:
    element: "Salary profile"
- tapOn: "Salary profile"
- scroll
- tapOn: "Gross base salary \\(monthly\\)"
- inputText: "1500.00"
- back
- scroll
- tapOn: "IRS withholding rate \\(%\\)"
- inputText: "15"
- back
- scrollUntilVisible:
    element: "Meal allowance per working day"
- tapOn: "Meal allowance per working day"
- inputText: "7.63"
- back
- scrollUntilVisible:
    element: "Add extra"
- tapOn: "Add extra"
- tapOn: "Name"
- inputText: "Bonus"
- back
- tapOn: "Amount per year"
- inputText: "600"
- back
- tapOn: "Dec"
- tapOn: "Save"
- waitForAnimationToEnd
# Persist the profile itself (its own Save at the bottom of the screen).
- scrollUntilVisible:
    element: "Save"
- tapOn: "Save"
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        id: "nav_plan"
    commands:
      - back

# --- Limits ---
- scrollUntilVisible:
    element: "Food"
- tapOn: "Food"
- tapOn: "Monthly limit"
- inputText: "300"
- tapOn: "Save"
- waitForAnimationToEnd
- tapOn: "Shopping"
- tapOn: "Monthly limit"
- inputText: "150"
- tapOn: "Save"
- waitForAnimationToEnd
- tapOn: "Transfer"
- tapOn: "Monthly limit"
- inputText: "750"
- tapOn: "Save"
- waitForAnimationToEnd

# --- Goal (linked to Investments) ---
- scrollUntilVisible:
    element: "Add goal"
- tapOn: "Add goal"
- tapOn: "Name"
- inputText: "Holiday fund"
- back
- tapOn: "Target"
- inputText: "1200"
- back
- tapOn: "Investments"
- tapOn: "Save"
- waitForAnimationToEnd

# --- Recurring ---
- scrollUntilVisible:
    element: "Manage recurring"
- tapOn: "Manage recurring"
- tapOn:
    id: "recurring_add"
- tapOn: "Name"
- inputText: "Internet"
- back
- tapOn: "Amount"
- inputText: "39.99"
- back
- tapOn: "Shopping"
- tapOn: "Save"
- assertVisible: "Internet"
- back

# --- Screenshots ---
- tapOn:
    id: "nav_home"
- extendedWaitUntil:
    visible:
      id: "dashboard_list"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: maestro-out/screens/home
- tapOn:
    id: "nav_activity"
- extendedWaitUntil:
    visible:
      id: "activity_list"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: maestro-out/screens/activity
- tapOn:
    id: "nav_plan"
- waitForAnimationToEnd
# The Plan tab keeps its scroll position: go back to the top for the first shot.
- scrollUntilVisible:
    element: "Expected income"
    direction: UP
- waitForAnimationToEnd
- takeScreenshot: maestro-out/screens/plan
- scrollUntilVisible:
    element: "Meal allowance"
    centerElement: true
- waitForAnimationToEnd
- takeScreenshot: maestro-out/screens/plan-income
- tapOn:
    id: "nav_insights"
- waitForAnimationToEnd
- takeScreenshot: maestro-out/screens/insights
- tapOn:
    id: "nav_home"
- extendedWaitUntil:
    visible:
      id: "dashboard_list"
    timeout: 10000
- tapOn:
    id: "dashboard_add_expense"
- waitForAnimationToEnd
- inputText: "42.00"
- tapOn: "Name"
- inputText: "Dinner"
- back
- waitForAnimationToEnd
- takeScreenshot: maestro-out/screens/add-expense
