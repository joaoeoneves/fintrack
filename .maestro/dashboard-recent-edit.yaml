appId: com.joaoeoneves.fintrack
---
# Dashboard recent-row E2E flow for FinTrack.
#
# Tapping a row in Home's merged "Recent activity" list opens that item's edit
# screen ("Edit expense" / "Edit income") with its values prefilled. The section title and the
# "See all" link (tag see_all_activity) open the Activity tab.
#
# Assumes the app is already signed in and lands on the Dashboard, same as golden-path.yaml.
# Creates "Maestro E2E Recent Expense" and "Maestro E2E Recent Income" and deletes each at the end
# while its list is search-filtered to that name, so no pre-existing data is ever touched.

- launchApp

# --- 0: Pin English + EUR, mirroring golden-path.yaml's steps 0/0b.
- tapOn:
    text: "Settings|Definições"
- tapOn: "English"
- back
- tapOn:
    text: "Settings|Definições"
- tapOn: "Display currency"
- tapOn: "Euro (€)"
- tapOn: "Back"
- assertVisible:
    id: "dashboard_list"

# --- 1: Add the expense and open it from its recent row.
- tapOn: "Add expense"
- assertVisible: "Add expense"
- tapOn: "Name"
- inputText: "Maestro E2E Recent Expense"
- tapOn: "Amount"
- inputText: "23.45"
- hideKeyboard
- tapOn: "Save"
- assertVisible:
    id: "dashboard_list"
# The extra plain scroll brings the row fully inside the LazyColumn's clip bounds before tapping
# (see income-tracking.yaml step 4).
- scrollUntilVisible:
    element: "Maestro E2E Recent Expense"
    direction: DOWN
- scroll
- assertVisible: "[-−]€23\\.45"
- tapOn: "Maestro E2E Recent Expense"
- assertVisible: "Edit expense"
- assertVisible: "Maestro E2E Recent Expense"
- assertVisible: "23\\.45"
# The top-bar back arrow is the edit screen's Cancel (content description "Cancel").
- tapOn: "Cancel"
- assertNotVisible: "Edit expense"
- assertVisible: "Maestro E2E Recent Expense"

# --- 2: Same for income.
- tapOn: "Add income"
- assertVisible: "Add income"
- tapOn: "Source"
- inputText: "Maestro E2E Recent Income"
- tapOn: "Amount"
- inputText: "34.56"
- hideKeyboard
- tapOn: "Save"
- assertVisible:
    id: "dashboard_list"
- scrollUntilVisible:
    element: "Maestro E2E Recent Income"
    direction: DOWN
- scroll
- assertVisible: "\\+€34\\.56"
- tapOn: "Maestro E2E Recent Income"
- assertVisible: "Edit income"
- assertVisible: "Maestro E2E Recent Income"
- assertVisible: "34\\.56"
- tapOn: "Cancel"
- assertNotVisible: "Edit income"
- assertVisible: "Maestro E2E Recent Income"

# --- 3: The "Recent activity" title still opens the Activity tab (Expenses segment); delete the
# expense there while the list is search-filtered to its name.
- scrollUntilVisible:
    element: "Recent activity"
    direction: UP
- tapOn: "Recent activity"
- assertVisible: "All expenses"
- tapOn: "Search"
- inputText: "Maestro E2E Recent Expense"
- hideKeyboard
- assertVisible: "[-−]€23\\.45"
# TODO calibrate on first real run: y% estimated for the single search-filtered row
- swipe:
    start: "90%, 40%"
    end: "10%, 40%"
    duration: 800
- assertNotVisible: "[-−]€23\\.45"
- assertVisible: "Undo"
- tapOn: "Maestro E2E Recent Expense"
- eraseText: 30
- hideKeyboard
- back
- assertVisible:
    id: "dashboard_list"

# --- 4: Open the Activity tab via "See all", switch to Income and delete the income the same way.
- scrollUntilVisible:
    element:
      id: "see_all_activity"
    direction: DOWN
- scroll
- tapOn:
    id: "see_all_activity"
# "See all" opens the Activity tab on Expenses; switch to the Income segment.
- tapOn: "Income"
- assertVisible: "All income"
- tapOn: "Search"
- inputText: "Maestro E2E Recent Income"
- hideKeyboard
- assertVisible: "\\+€34\\.56"
# TODO calibrate on first real run: y% estimated for the single search-filtered row
- swipe:
    start: "90%, 40%"
    end: "10%, 40%"
    duration: 800
- assertNotVisible: "\\+€34\\.56"
- assertVisible: "Undo"
- tapOn: "Maestro E2E Recent Income"
- eraseText: 30
- hideKeyboard
- back
- assertVisible:
    id: "dashboard_list"
