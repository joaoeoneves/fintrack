appId: com.joaoeoneves.fintrack
tags:
  - release
---
# Golden-path E2E flow for FinTrack.
#
# Assumes the app is already signed in (persisted Credential Manager / Firebase Auth session) —
# real Google Sign-In cannot be scripted headlessly by Maestro, so this flow starts from the
# Dashboard. If the app instead shows a sign-in screen, that's a sign the persisted session was
# lost and this flow will fail fast at the "Total:" assertion below rather than silently
# continuing on the wrong screen.

- runFlow: _guest-start.yaml

# --- 0: Pin language to English before any of the (English) assertions below. Fresh installs now
# default to AppLanguage.PORTUGUESE instead of AppLanguage.SYSTEM, so this flow can no longer
# assume the app renders in English out of the box. The Settings entry point's label is itself
# locale-dependent ("Settings" vs. "Definições"), so match either via regex alternation since we
# don't yet know which is currently in effect. "English" is always labeled "English" regardless
# of the active app language (see settings.yaml's currency-pinning header comment for the general
# "pin a known baseline" pattern this mirrors). No restore-to-original-language step at the end of
# this flow is needed: golden-path.yaml doesn't restore any other global setting either (unlike
# settings.yaml, which restores theme/currency because other flows depend on those defaults).
- tapOn:
    text: "Settings|Definições"
- tapOn: "English"
- back

# --- 0b: Pin currency to EUR before the "−€12.34"/"−€56.78" assertions below. Fresh installs now
# default to EUR, but this device may have an explicit USD selection persisted from a prior run of
# settings.yaml or income-tracking.yaml (an explicit selection is never retroactively changed by
# what the fallback default is) -- these flows share a device/emulator and don't run in isolation,
# so pin a known baseline here explicitly rather than assuming whatever currency another flow left
# the device on. Mirrors the exact navigation pattern already used in settings.yaml's own
# currency-switching steps: open Settings, tap "Display currency" (an inline exposed-dropdown on
# the Settings screen itself, not a separate screen), tap the target currency option (selects it
# and closes the dropdown, still on Settings), then tap "Back" (the top-app-bar back arrow,
# content-desc "Back") to return directly to the Dashboard. No restore-to-original-currency step at
# the end of this flow is needed, same reasoning as the language pin above.
- tapOn:
    text: "Settings|Definições"
- extendedWaitUntil:
    visible: "Appearance"
    timeout: 10000
- scrollUntilVisible:
    element: "Display currency"
    direction: DOWN
- tapOn: "Display currency"
- tapOn: "Euro (€)"
- tapOn: "Back"

# --- 1: Home (the former dashboard) loads with the month selector, balance summary card and bottom bar ---
# The period selector replaced the old 1W/1M/3M/6M/1Y chips: previous/next month arrows (content
# descriptions "Previous month"/"Next month") around a tappable month label ("October 2026"). The
# default period is the current calendar month, matched by a generic "<Month> <yyyy>" regex so the
# flow doesn't go stale when the calendar rolls over.
# The "Add expense" entry point is the floating add pill on Home -- see step 2 below. The Activity
# tab's lists have no add control of their own.
#
# The four category assertions below use a ".*<name>.*" wildcard, not a bare category name.
# PieChart.kt's legend rows (fix(dashboard): add TalkBack accessibility to pie chart, 2026-07-21)
# now collapse each row's children into a single Modifier.clearAndSetSemantics node exposing only
# a merged content description (e.g. "Recurring, 6 percent, 72,00€") -- the literal "Recurring"
# text is no longer its own accessibility node. A bare "Recurring" assertVisible is a full-string
# regex match and fails against that merged label; "Transfer"/"Investments"/"Shopping" only
# happened to keep passing incidentally via the separate Budgets-section category TextViews below
# the pie chart, which "Recurring"'s budget row doesn't share since it sits just past the fold and
# isn't composed yet at this scroll position. Wildcarding restores the original "pie legend is
# visible" intent for all four regardless of scroll position, and keeps matching whichever of the
# two (legend content-desc or Budgets-section literal text) happens to be on screen.
- assertVisible:
    id: "dashboard_list"
- assertVisible: "Previous month"
- assertVisible: "Next month"
- assertVisible: "[A-Z][a-z]+ [0-9]{4}"
- assertVisible: "Net balance"
- assertVisible: "Income"
# The balance card's outflow column is "Expenses"; investments count as saved,
# shown in their own "Saved & invested" column, plus a "Savings rate: NN%" (or "—") line.
- assertVisible: "Expenses"
- assertVisible: "Saved & invested"
- assertVisible: "Savings rate.*"
# The bottom navigation bar shows its four tabs on Home.
- assertVisible:
    id: "nav_home"
- assertVisible:
    id: "nav_activity"
- assertVisible:
    id: "nav_plan"
- assertVisible:
    id: "nav_insights"
# The category breakdown moved to the Insights tab: check it there, then return to Home.
- tapOn:
    id: "nav_insights"
- assertVisible: "Insights"
# "Recurring" is archived by default, so it is no longer asserted in the breakdown.
- tapOn:
    id: "nav_home"
- assertVisible:
    id: "dashboard_list"
# B6: capture the Dashboard so the outer-Scaffold-padding removal can be checked visually (no
# doubled gap above the top bar, last card not clipped above the nav bar).
- takeScreenshot: build/maestro/golden-path-dashboard
- scroll
- scroll
- scroll
- scroll
- takeScreenshot: build/maestro/golden-path-dashboard-bottom
- scrollUntilVisible:
    element: "Net balance"
    direction: UP

# --- 2: Add a new expense via the Dashboard's floating add pill ---
# Home's merged "Recent activity" section has a clickable title and a "See all" link but no plus
# icon; adding goes only through the floating pill (content description "Add expense", matched by
# Maestro the same way as visible text).
# The pill ("Add expense"/"Add income") lives in the Scaffold FAB slot outside the LazyColumn and
# hides while scrolling down, so tap it directly with no scrolling first.
- tapOn: "Add expense"
- assertVisible: "Add expense"
- tapOn: "Name"
- inputText: "Maestro E2E Test Expense"
- tapOn: "Amount"
- inputText: "12.34"
- hideKeyboard
- tapOn: "Save"

# Saving pops back to the Dashboard (that's where we navigated from) -- the new expense should show
# up immediately in the "Recent activity" list (it sorts by date descending, and this row is the
# most recent). Money formatting now follows the app locale via NumberFormat, so English + EUR
# renders as "[-−]€12.34" (prefixed symbol, period decimal).
- scrollUntilVisible:
    element: "Maestro E2E Test Expense"
    direction: DOWN
- assertVisible: "Maestro E2E Test Expense"
- assertVisible: "[-−]€12\\.34"

# --- 3: Edit it (change the amount) and confirm the change persists ---
# Tapping a row in Home's "Recent activity" list opens that expense's edit screen directly,
# and Save pops back to the Dashboard. The extra plain scroll brings the row fully inside the
# LazyColumn's clip bounds before tapping (see income-tracking.yaml step 4).
- scroll
- tapOn: "Maestro E2E Test Expense"
- assertVisible: "Edit expense"
# In edit mode the amount is prefilled with the *locale's* decimal separator (no longer the
# currency's) -- English (pinned in step 0) uses '.', so the field shows "12.34".
- assertVisible: "12\\.34"
# The amount is a custom field: tapping it puts the cursor where tapped (not at the end), so tap
# its right edge to land the cursor after the last digit before erasing.
- tapOn:
    text: "Amount"
    point: "99%,50%"
- eraseText: 20
# B4: the amount field still accepts ',' as the decimal separator even in English, proving comma
# parsing keeps working regardless of the locale's own separator.
- inputText: "56,78"
- hideKeyboard
- tapOn: "Save"

# Back on the Dashboard, the recent row shows the updated amount.
- assertVisible:
    id: "dashboard_list"
- scrollUntilVisible:
    element: "Maestro E2E Test Expense"
    direction: DOWN
- assertVisible: "[-−]€56\\.78"
- assertNotVisible: "[-−]€12\\.34"

# Open the Activity tab (unified list) via "See all" for the delete step below.
- scrollUntilVisible:
    element:
      id: "see_all_activity"
    direction: DOWN
- scroll
- tapOn:
    id: "see_all_activity"
- assertVisible:
    id: "activity_list"
- scrollUntilVisible:
    element: "Maestro E2E Test Expense"
    direction: DOWN

# --- 4: Delete it and confirm it's gone ---
# Deletion is immediate via an end->start swipe on the row (the trash IconButton is gone) -- there
# is no confirmation dialog. An undo snackbar ("Deleted "<name>"" / "Undo") appears.
# Filter the list down to this flow's own row first so the swipe can never hit a
# pre-existing real expense (e.g. another expense dated today sorting above it).
- tapOn: "Search"
- inputText: "Maestro E2E Test Expense"
- hideKeyboard
- scrollUntilVisible:
    element: "Maestro E2E Test Expense"
    direction: DOWN
- assertVisible: "[-−]€56\\.78"
# coordinates, not from-element swipes, which don't pass the dismiss threshold -- see swipe-delete-check.yaml).
# After the redesign the single filtered row sits at ~81% of the screen height (above the bottom
# nav), not where _swipe-delete-row.yaml expects it, so swipe inline starting right of the
# floating add pill.
- swipe:
    start: 92%, 81%
    end: 8%, 81%
    duration: 500
- assertNotVisible: "[-−]€56\\.78"
- assertVisible: "Undo"
# Let the undo snackbar time out on its own so the expense stays deleted, then clear the search.
- eraseText: 30

# --- 5: Exercise the list's own period selector (ExpenseListScreen has the same PeriodSelector as
# the Dashboard). Open the period menu via the label's dropdown icon (content description "Change
# period"), pick a rolling window, and check the label reflects it; then restore "This month".
- tapOn: "Change period"
- assertVisible: "This month"
- assertVisible: "Choose month.*"
# (Rolling windows such as "Last 3 months" now live only in the Insights tab's period picker.)
- tapOn: "This month"
- assertVisible: "[A-Z][a-z]+ [0-9]{4}"
- assertVisible: "Previous month"
- back
