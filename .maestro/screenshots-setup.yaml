appId: com.joaoeoneves.fintrack
---
# README screenshots, part 1 (run by scripts/screenshots.sh, not on its own): a fresh guest set to English and
# Dark with a salary profile and the recurring bills. The script then adds a year of demo expenses and income to
# the guest file (scripts/demo_data.py) and runs .maestro/screenshots.yaml to take the pictures.
# Money inputs are cash-register style: digits only ("6420" = 64.20).

- runFlow: _guest-start.yaml

# --- English + Dark (EUR is fixed) ---
- tapOn:
    id: "account_avatar"
- tapOn: "Language|Idioma"
# Index -1 = the open menu's option (the row's own value can also read "English").
- tapOn:
    text: "English"
    index: -1
- extendedWaitUntil:
    visible: "Preferences"
    timeout: 10000
- tapOn: "Theme"
- tapOn:
    text: "Dark"
    index: -1
- back
- extendedWaitUntil:
    visible:
      id: "dashboard_list"
    timeout: 10000

# --- Income tab: salary profile (private sector, 1 650 gross, 13% IRS, subsidies in twelfths, meal card) ---
- tapOn:
    id: "nav_income"
- extendedWaitUntil:
    visible: "Salary profile"
    timeout: 10000
- tapOn: "Salary profile"
- tapOn: "Private sector"
- tapOn: "Gross base salary \\(monthly\\)"
- inputText: "165000"
- tapOn: "IRS withholding rate \\(%\\)"
- inputText: "13"
- scrollUntilVisible:
    element: "Next"
    centerElement: true
- tapOn: "Next"
- tapOn: "50%"
- tapOn: "Next"
- tapOn: "Yes, on a card"
- tapOn: "Meal allowance per working day"
- inputText: "1020"
- tapOn: "Vacation days per year"
- inputText: "22"
- tapOn: "Next"
- tapOn: "Save"
- extendedWaitUntil:
    visible: "Expected income"
    timeout: 10000

# --- Spending tab > Recurring: rent, internet, gym, monthly ETF ---
- tapOn:
    id: "nav_spending"
- scrollUntilVisible:
    element: "Recurring"
- tapOn: "Recurring"
- tapOn: "Add recurring"
- inputText: "72500"
- tapOn: "Name"
- inputText: "Rent"
- tapOn: "Home"
- tapOn: "Save"
- extendedWaitUntil:
    visible: "Add recurring"
    timeout: 10000
- tapOn: "Add recurring"
- inputText: "3499"
- tapOn: "Name"
- inputText: "Internet & phone"
- tapOn: "Home"
- tapOn: "Save"
- extendedWaitUntil:
    visible: "Add recurring"
    timeout: 10000
- tapOn: "Add recurring"
- inputText: "3290"
- tapOn: "Name"
- inputText: "Gym"
- tapOn: "Health"
- tapOn: "Save"
- extendedWaitUntil:
    visible: "Add recurring"
    timeout: 10000
- back
- stopApp
