appId: com.joaoeoneves.fintrack
---
# Helper (not a standalone flow): starts from a fresh install in guest mode, so a flow never depends
# on a signed-in account or on data left by another flow (CI has no Google account).
- clearState
- launchApp
- extendedWaitUntil:
    visible:
      id: "continue_as_guest"
    timeout: 25000
- tapOn:
    id: "continue_as_guest"
- extendedWaitUntil:
    visible:
      id: "dashboard_list"
    timeout: 15000
