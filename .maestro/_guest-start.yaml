appId: com.joaoeoneves.fintrack
---
# Helper (not a standalone flow): starts from a fresh install in guest mode, so a flow never depends
# on a signed-in account or on data left by another flow (CI has no Google account).
- stopApp
- clearState
- launchApp
# The CI emulator's launcher sometimes ANRs on boot and its dialog covers the app: keep dismissing
# it ("Wait") until the sign-in screen is reachable.
- repeat:
    while:
      notVisible:
        id: "continue_as_guest"
    times: 6
    commands:
      - runFlow:
          when:
            visible: ".*isn't responding"
          commands:
            - tapOn: "Wait"
      - extendedWaitUntil:
          visible:
            id: "continue_as_guest"
          timeout: 5000
          optional: true
- extendedWaitUntil:
    visible:
      id: "continue_as_guest"
    timeout: 30000
- tapOn:
    id: "continue_as_guest"
- extendedWaitUntil:
    visible:
      id: "dashboard_list"
    timeout: 15000
