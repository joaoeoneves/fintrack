appId: com.joaoeoneves.fintrack
---
# Expense-list category filter + extended search E2E flow for FinTrack.
#
# The expense list has a horizontally scrollable row of single-select category FilterChips ("All",
# "Transfer", "Investments", "Shopping", "Recurring"; persisted across visits), and its search now
# also matches the note, the category name and the amount.
#
# Assumes the app is already signed in and lands on the Dashboard, same as golden-path.yaml.
# Creates "Maestro E2E Filter A" (Shopping, note "maestro-note-xyz") and "Maestro E2E Filter B"
# (Transfer) and deletes both while the list is search-filtered to "Maestro E2E Filter", so no
# pre-existing data is ever touched. Ends with the search cleared and the chip reset to "All".

- launchApp

# --- 0: Pin English + EUR, mirroring golden-path.yaml's steps 0/0b.
- tapOn:
    text: "Settings|Definições"
- tapOn: "English"
- back
- tapOn:
    text: "Settings|Definições"
- tapOn: "Display currency"
- tapOn: "Euro (€)"
- tapOn: "Back"
- assertVisible:
    id: "dashboard_list"

# --- 1: Add A (Shopping, with a note) and B (Transfer).
- tapOn: "Add expense"
- assertVisible: "Add expense"
- tapOn: "Name"
- inputText: "Maestro E2E Filter A"
- tapOn: "Amount"
- inputText: "11.11"
- hideKeyboard
# Category is now a FlowRow of chips ("Category" is a plain label), so tap the chip directly.
- tapOn: "Shopping"
- tapOn: "Note \\(optional\\)"
- inputText: "maestro-note-xyz"
- hideKeyboard
- tapOn: "Save"
- assertVisible:
    id: "dashboard_list"

- tapOn: "Add expense"
- assertVisible: "Add expense"
- tapOn: "Name"
- inputText: "Maestro E2E Filter B"
- tapOn: "Amount"
- inputText: "22.22"
- hideKeyboard
- tapOn: "Transfer"
- tapOn: "Save"
- assertVisible:
    id: "dashboard_list"

# --- 2: Open the list. Searching the note matches only A.
- scrollUntilVisible:
    element:
      id: "see_all_activity"
    direction: DOWN
- scroll
- tapOn:
    id: "see_all_activity"
- assertVisible: "All expenses"
- assertVisible:
    id: "filter_chip_all"
- tapOn: "Search"
- inputText: "maestro-note-xyz"
- hideKeyboard
- assertVisible: "Maestro E2E Filter A"
- assertNotVisible: "Maestro E2E Filter B"

# --- 3: Search by name shows both; the "Transfer" chip narrows it to B, "All" shows both again.
# Chips are tapped by test tag (resource id): filter_chip_all / filter_chip_<category id>.
- tapOn: "maestro-note-xyz"
- eraseText: 30
- inputText: "Maestro E2E Filter"
- hideKeyboard
- assertVisible: "Maestro E2E Filter A"
- assertVisible: "Maestro E2E Filter B"
- tapOn:
    id: "filter_chip_TRANSFER"
- assertVisible: "Maestro E2E Filter B"
- assertNotVisible: "Maestro E2E Filter A"
- takeScreenshot: build/maestro/expense-filter-transfer
- tapOn:
    id: "filter_chip_all"
- assertVisible: "Maestro E2E Filter A"
- assertVisible: "Maestro E2E Filter B"

# --- 4: Delete both while the list only contains this flow's two rows.
# TODO calibrate on first real run: y% estimated for the single search-filtered row
- swipe:
    start: "90%, 40%"
    end: "10%, 40%"
    duration: 800
- assertVisible: "Undo"
# TODO calibrate on first real run: y% estimated for the single search-filtered row
- swipe:
    start: "90%, 40%"
    end: "10%, 40%"
    duration: 800
- assertNotVisible: "Maestro E2E Filter A"
- assertNotVisible: "Maestro E2E Filter B"

# --- 5: Clear the search, make sure the chip is back on "All", and return to the Dashboard.
- tapOn: "Maestro E2E Filter"
- eraseText: 30
- hideKeyboard
- tapOn:
    id: "filter_chip_all"
# CategoryChip is a selectable (Role.RadioButton) node, exposed as selected rather than checked.
# TODO calibrate on first real run: confirm Maestro reads Compose `selected` via `selected: true`.
- assertVisible:
    id: "filter_chip_all"
    selected: true
- assertNotVisible:
    id: "filter_chip_TRANSFER"
    selected: true
- back
- assertVisible:
    id: "dashboard_list"
