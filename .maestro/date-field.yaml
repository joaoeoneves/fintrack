appId: com.joaoeoneves.fintrack
---
# Regression flow for the "date field only opens the picker via the trailing icon" bug fix
# (ReadOnlyDateField, at app/src/main/java/com/joaoeoneves/fintrack/ui/common/DateField.kt, shared
# by both ExpenseForm in AddEditExpenseScreen.kt and IncomeForm in AddEditIncomeScreen.kt).
# Confirms, on a real running app:
#  1. Tapping the date field's text body (not the trailing icon) opens the DatePickerDialog.
#  2. Tapping the trailing icon (content description "Change date") still also opens it
#     (regression guard -- confirms the icon didn't break as a side effect of the fix).
#
# Only exercises the Add Expense screen. ExpenseForm and IncomeForm both render the exact same
# ReadOnlyDateField composable with no per-form differences, so one form is representative of
# both -- see app/src/androidTest/java/com/joaoeoneves/fintrack/ui/common/DateFieldTest.kt for the
# composable-level test (the more precise tier for this specific bug), which covers
# ReadOnlyDateField directly and thus both forms.
# This flow is the "actually wired up in a real running app" confirmation Maestro is for.
#
# Cancels out of the Add Expense screen at the end without saving (AddEditExpenseScreen's
# onCancel just pops the back stack -- see FinTrackNavHost.kt), so no expense is created and no
# other flow's assertions/state are disrupted. Assumes the app is already signed in and lands on
# the Dashboard, same assumption as golden-path.yaml -- see that flow's header comment for why.

- launchApp

# --- 0: Pin language to English before the "OK" text assertions below, mirroring the exact
# pattern (and reasoning) in golden-path.yaml's own step 0. action_ok ("OK") happens to have no
# values-pt-rPT override, but pinning the language still keeps this flow self-contained and not
# dependent on whatever language another flow left the device in.
- tapOn:
    text: "Settings|Definições"
- tapOn: "English"
- back

# --- 1: Open Add expense from the Dashboard's "Recent expenses" card plus icon ---
- scrollUntilVisible:
    element: "Add expense"
    direction: DOWN
- tapOn: "Add expense"
- assertVisible: "Add expense"

# --- 2: The date field defaults to today, formatted "MMM d, yyyy" (e.g. "Jul 21, 2026") by
# rememberLocaleAwareDateFormatter() -- match it with a regex since the exact day is dynamic.
- assertVisible: "[A-Za-z]{3} [0-9]{1,2}, [0-9]{4}"

# --- 3: Tap the field's text body (NOT the trailing icon) -- this used to be a no-op before the
# MutableInteractionSource + PressInteraction.Release fix in ReadOnlyDateField.
- tapOn: "[A-Za-z]{3} [0-9]{1,2}, [0-9]{4}"
- assertVisible: "OK"
# Confirm with OK rather than Cancel: the dialog's initial selection is the field's current
# (today's) date, so confirming re-applies the same date -- a no-op functionally, and it avoids
# "Cancel" briefly colliding with the top app bar's own cd_cancel ("Cancel") IconButton while the
# dialog is still showing.
- tapOn: "OK"

# --- 4: Tap the trailing icon (content description "Change date") -- confirms its own onClick
# still independently opens the dialog too, unaffected by the body-tap fix.
- tapOn: "Change date"
- assertVisible: "OK"
- tapOn: "OK"

# --- 5: Leave the screen without saving (pops back to the Dashboard), so no expense is created
# and the device is left exactly as this flow found it.
- tapOn: "Cancel"
