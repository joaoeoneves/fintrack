appId: com.joaoeoneves.fintrack
---
# Monthly plan E2E flow: Dashboard "Plan your month" CTA / "Edit plan" -> Monthly plan screen ->
# add two income lines (Salary 2000, Meal allowance 200) -> allocate 300 to Food -> back on the
# Dashboard the "Safe to spend" card shows ~1,900.00 -> Planned toggle in the spending breakdown
# card lists Food -> cleanup (remove both income lines, clear the Food allocation).
#
# STATUS: written but NOT YET RUN on a device/emulator -- selectors are taken from strings.xml and
# the plan composables, so expect small tweaks on the first real run.
#
# Assumes the app is already signed in (or in guest mode) and lands on the Dashboard, like
# golden-path.yaml. Assumes Food has no allocation and the plan has no income lines to begin with;
# everything this flow adds is removed again at the end.

- launchApp

# --- 0: Pin English + EUR, mirroring budget.yaml ---
- tapOn:
    text: "Settings|Definições"
- tapOn: "English"
- back
- tapOn:
    text: "Settings|Definições"
- tapOn: "Display currency"
- tapOn: "Euro (€)"
- tapOn: "Back"
- assertVisible:
    id: "dashboard_list"

# --- 1: Open the plan from the Dashboard card (CTA when empty, "Edit plan" otherwise) ---
- scrollUntilVisible:
    element: "Plan your month|Edit plan"
    direction: DOWN
- tapOn: "Plan your month|Edit plan"
- assertVisible: "Monthly plan"

# --- 2: Add income lines ---
- tapOn: "Add income line"
- assertVisible: "New income line"
- tapOn: "Label"
- inputText: "Salary"
- tapOn: "Amount"
- inputText: "2000"
- hideKeyboard
- tapOn: "Save"
- assertNotVisible: "New income line"
- assertVisible: "Salary"

- scrollUntilVisible:
    element: "Add income line"
    direction: DOWN
- tapOn: "Add income line"
- assertVisible: "New income line"
- tapOn: "Label"
- inputText: "Meal allowance"
- tapOn: "Amount"
- inputText: "200"
- hideKeyboard
- tapOn: "Save"
- assertNotVisible: "New income line"
- assertVisible: "Meal allowance"

# --- 3: Allocate 300 to Food ---
- scrollUntilVisible:
    element: "Allocations"
    direction: DOWN
- scrollUntilVisible:
    element: "Food"
    direction: DOWN
- tapOn: "Food"
- assertVisible: "Set budget for Food"
- tapOn: "Monthly limit"
- inputText: "300"
- hideKeyboard
- tapOn: "Save"
- assertNotVisible: "Set budget for Food"
- assertVisible: ".*300\\.00.*"

# --- 4: Back to the Dashboard: safe to spend = 2,200 - 300 = ~1,900 ---
- tapOn: "Back"
- assertVisible:
    id: "dashboard_list"
- scrollUntilVisible:
    element: "Safe to spend.*"
    direction: UP
- assertVisible: ".*1,?900\\.00.*"

# --- 5: Planned toggle in the spending breakdown card lists Food ---
- scrollUntilVisible:
    element: "Planned"
    direction: DOWN
- tapOn: "Planned"
# Breakdown rows are merged nodes ("Food, 100 percent, 300,00 €"), so match with a wildcard.
- assertVisible: ".*Food.*"

# --- 6: Cleanup -- remove both income lines and clear the Food allocation ---
- scrollUntilVisible:
    element: "Edit plan"
    direction: UP
- tapOn: "Edit plan"
- assertVisible: "Monthly plan"

- tapOn: "Salary"
- assertVisible: "Edit income line"
- tapOn: "Remove"
- assertNotVisible: "Edit income line"
- assertNotVisible: "Salary"

- tapOn: "Meal allowance"
- assertVisible: "Edit income line"
- tapOn: "Remove"
- assertNotVisible: "Edit income line"
- assertNotVisible: "Meal allowance"

- scrollUntilVisible:
    element: "Food"
    direction: DOWN
- tapOn: "Food"
- assertVisible: "Set budget for Food"
- tapOn: "Remove"
- assertNotVisible: "Set budget for Food"

- tapOn: "Back"
- assertVisible:
    id: "dashboard_list"
