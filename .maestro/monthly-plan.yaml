appId: com.joaoeoneves.fintrack
tags:
  - release
---
# Plan tab basics (release smoke): guest start -> Plan tab -> the sections are there in order
# (summary, Expected income with "Salary profile", Limits, Groups, Goals, Recurring) -> open the Food
# limit sheet and close it again. Starts from a fresh guest install (see _guest-start.yaml), so
# nothing needs cleaning up afterwards.

- runFlow: _guest-start.yaml

# Pin English (fresh installs default to Portuguese).
- tapOn:
    text: "Settings|Definições"
- tapOn: "Language|Idioma"
# Index -1 = the open menu's option (the row's own value can also read "English").
- tapOn:
    text: "English"
    index: -1
- back
- assertVisible:
    id: "dashboard_list"

- tapOn:
    id: "nav_plan"
- assertVisible: "Expected income"
- assertVisible: "Previous month"

# Expected income starts with the salary profile row.
- scrollUntilVisible:
    element: "Salary profile"
    direction: DOWN

# Limits section lists the categories. (Not editing a limit here: with the soft keyboard up the
# limit sheet's Save sits below the keyboard and the sheet doesn't scroll, and hideKeyboard is
# unsafe on ATD images that have no IME.)
- scrollUntilVisible:
    element: "Limits"
    direction: DOWN
- scrollUntilVisible:
    element: "Food"
    direction: DOWN
- tapOn: "Food"
- assertVisible: "Set limit for Food"
- assertVisible: "Monthly limit"
- back
- assertNotVisible: "Set limit for Food"

# The remaining sections further down the tab.
- scrollUntilVisible:
    element: "Goals"
    direction: DOWN
- scrollUntilVisible:
    element: "Recurring"
    direction: DOWN
