appId: com.joaoeoneves.fintrack
tags:
  - release
---
# Plan tab basics (release smoke): guest start -> Plan tab -> the month view is there (period selector,
# Income/Bills/Savings/Envelopes/Free tiles, payday line, envelopes, "Set up" rows) -> open Set up ->
# Income, check the salary profile row and that a new income line offers "Record automatically" with a
# pay day (item C) -> close the sheet and return. Starts from a fresh guest install (see
# _guest-start.yaml), so nothing needs cleaning up afterwards.

- runFlow: _guest-start.yaml

# Pin English (fresh installs default to Portuguese). The account/settings entry point is the avatar.
- tapOn:
    id: "account_avatar"
- tapOn: "Language|Idioma"
# Index -1 = the open menu's option (the row's own value can also read "English").
- tapOn:
    text: "English"
    index: -1
- back
- assertVisible:
    id: "dashboard_list"

- tapOn:
    id: "nav_plan"
- assertVisible: "Previous month"
- assertVisible: "Bills"
- assertVisible: "Free"
- assertVisible: "Payday.*"

# The envelopes section and the "Set up" group further down the tab.
- scrollUntilVisible:
    element: "Set up"
    direction: DOWN
- assertVisible: "Categories"

# Set up -> Income. "Income" is also a tile label above, so take the last match (the Set up row).
- tapOn:
    text: "Income"
    index: -1
- extendedWaitUntil:
    visible: "Salary profile"
    timeout: 10000
- assertVisible: "Payday.*"

# A new income line carries "Record automatically" and a pay day. (Not typing anything: with the soft
# keyboard up the sheet's Save sits below it, and hideKeyboard is unsafe on ATD images with no IME.)
- scrollUntilVisible:
    element: "Add income line"
    direction: DOWN
- tapOn: "Add income line"
- assertVisible: "New income line"
- scrollUntilVisible:
    element: "Record automatically"
    direction: DOWN
- assertVisible: "Payday"
- back
- assertNotVisible: "New income line"

# Back to the Plan tab.
- back
- assertVisible:
    id: "nav_plan"
