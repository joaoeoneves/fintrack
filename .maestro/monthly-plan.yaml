appId: com.joaoeoneves.fintrack
tags:
  - release
---
# Plan tab basics (release smoke): guest start -> Plan tab -> the sections are there in order
# (summary, Expected income with "Salary profile", Limits, Groups, Goals, Recurring) -> set a 300
# limit on Food and see it listed. Starts from a fresh guest install (see _guest-start.yaml), so
# nothing needs cleaning up afterwards.

- runFlow: _guest-start.yaml

# Pin English (fresh installs default to Portuguese).
- tapOn:
    text: "Settings|Definições"
- tapOn: "English"
- back
- assertVisible:
    id: "dashboard_list"

- tapOn:
    id: "nav_plan"
- assertVisible: "Monthly plan"
- assertVisible: "Previous month"

# Expected income starts with the salary profile row.
- scrollUntilVisible:
    element: "Salary profile"
    direction: DOWN

# Limits section: tap Food and give it a monthly limit.
- scrollUntilVisible:
    element: "Limits"
    direction: DOWN
- scrollUntilVisible:
    element: "Food"
    direction: DOWN
- tapOn: "Food"
- assertVisible: "Set budget for Food"
- tapOn: "Monthly limit"
- inputText: "300"
- hideKeyboard
- tapOn: "Save"
- assertNotVisible: "Set budget for Food"
- scrollUntilVisible:
    element: ".*300\\.00.*"
    direction: DOWN

# The remaining sections further down the tab.
- scrollUntilVisible:
    element: "Goals"
    direction: DOWN
- scrollUntilVisible:
    element: "Recurring"
    direction: DOWN
