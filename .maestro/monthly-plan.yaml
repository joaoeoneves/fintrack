appId: com.joaoeoneves.fintrack
tags:
  - release
---
# Plan tab basics (release smoke): guest start -> Plan tab -> the month view is there (period selector,
# Income/Recurring/Envelopes/Savings/Safe-to-spend summary rows, envelopes) -> open the Set up screen via the
# gear icon next to the "Plan" title (3.2: Income/Envelopes/Recurring/Categories rows live there, not on
# the tab any more) -> Income, check the salary profile row and that a new income line offers "Record automatically" with a
# pay day (item C) -> close the sheet and return. Starts from a fresh guest install (see
# _guest-start.yaml), so nothing needs cleaning up afterwards.

- runFlow: _guest-start.yaml

# Pin English (fresh installs default to Portuguese). The account/settings entry point is the avatar.
- tapOn:
    id: "account_avatar"
- tapOn: "Language|Idioma"
# Index -1 = the open menu's option (the row's own value can also read "English").
- tapOn:
    text: "English"
    index: -1
- back
- assertVisible:
    id: "dashboard_list"

- tapOn:
    id: "nav_plan"
- assertVisible: "Previous month"
- assertVisible: "Recurring"
- assertVisible: "Safe to spend"

# The gear icon beside the title opens the Set up screen (contentDescription "Set up").
- tapOn: "Set up"
- extendedWaitUntil:
    visible: "Categories"
    timeout: 10000
- assertVisible: "Recurring"
- assertVisible: "Envelopes"

# Set up -> Income.
- tapOn: "Income"
- extendedWaitUntil:
    visible: "Salary profile"
    timeout: 10000
- assertVisible: "Working days in.*"

# A new income line carries "Record automatically" and a pay day. (Not typing anything: with the soft
# keyboard up the sheet's Save sits below it, and hideKeyboard is unsafe on ATD images with no IME.)
- tapOn: "Add income"
- assertVisible: "New income"
- scrollUntilVisible:
    element: "Record automatically"
    direction: DOWN
- assertVisible: "Payday"
- back
- assertNotVisible: "New income"

# Back to Set up, then to the Plan tab.
- back
- assertVisible: "Categories"
- back
- assertVisible:
    id: "nav_plan"
