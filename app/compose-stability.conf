// Compose compiler stability configuration (see composeCompiler { } in build.gradle.kts).
// Declares types we know are immutable as stable so equal-but-new instances can skip recomposition
// via equals(). Only list a class here after verifying it is deeply immutable.

// java.time value types (Instant, LocalDate, YearMonth, ...) are immutable but live in the JDK, which
// the compiler cannot analyse.
java.time.*

// Immutable value types from the JDK. DateTimeFormatter is immutable and thread-safe; java.time.* does
// not cover the java.time.format subpackage.
java.time.format.DateTimeFormatter
java.util.Locale

// Kotlin collection interfaces (List, Set, Map) are read-only views; the compiler treats them as
// unstable because a MutableList could back them. Convention: UI state never holds a
// MutableList/MutableMap/MutableSet; build collections with toList()/map/filter and never mutate
// them after publishing them in state.
kotlin.collections.*

// Domain models: immutable data classes (val-only fields) and sealed hierarchies, including the
// Period, Transaction and Session interfaces.
com.joaoeoneves.fintrack.domain.model.*

// UiText: sealed interface of immutable data classes (a String or a @StringRes Int).
com.joaoeoneves.fintrack.ui.common.UiText
